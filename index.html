<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Evenly: split group costs fairly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#EEF3EF;--panel:#FFFFFF;--panel-2:#F5F8F6;--ink:#0E241C;--muted:#4F6B5F;--line:#C9D8CF;
  --court:#0D6A54;--court-ink:#FFFFFF;--court-soft:#DCEBE3;
  --cork:#F2A93B;--cork-ink:#2B1B00;
  --pos:#0D6A54;--neg:#B3302A;--neg-soft:#F8E1DE;--danger:#B3302A;
  --hero:#0D6A54;--hero-ink:#FFFFFF;
  --toast-bg:#0E241C;--toast-ink:#EEF3EF;--toast-link:#F2A93B;
  --av-s:55%;--av-l:84%;--av-ink-s:50%;--av-ink-l:22%;
  --f-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0A1612;--panel:#11231C;--panel-2:#15291F;--ink:#E6F1EA;--muted:#8FAA9C;--line:#26443A;
    --court:#4CCBA2;--court-ink:#04231A;--court-soft:#163529;
    --cork:#F2A93B;--cork-ink:#2B1B00;
    --pos:#5DDBB0;--neg:#FF9385;--neg-soft:#3B1F1C;--danger:#FF9385;
    --hero:#0F4B3C;--hero-ink:#F1F8F4;
    --toast-bg:#E6F1EA;--toast-ink:#0A1612;--toast-link:#0D6A54;
    --av-s:32%;--av-l:27%;--av-ink-s:60%;--av-ink-l:86%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1612;--panel:#11231C;--panel-2:#15291F;--ink:#E6F1EA;--muted:#8FAA9C;--line:#26443A;
  --court:#4CCBA2;--court-ink:#04231A;--court-soft:#163529;
  --cork:#F2A93B;--cork-ink:#2B1B00;
  --pos:#5DDBB0;--neg:#FF9385;--neg-soft:#3B1F1C;--danger:#FF9385;
  --hero:#0F4B3C;--hero-ink:#F1F8F4;
  --toast-bg:#E6F1EA;--toast-ink:#0A1612;--toast-link:#0D6A54;
  --av-s:32%;--av-l:27%;--av-ink-s:60%;--av-ink-l:86%;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--paper);-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2.5px solid var(--court);outline-offset:2px}
b{font-weight:700}
.muted{color:var(--muted)}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.k{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.num{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;white-space:nowrap}
.ic{flex:none}

.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.screen{padding-bottom:calc(128px + env(safe-area-inset-bottom,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 0;background:var(--paper)}
.topbar::before{content:"";position:absolute;left:-16px;right:-16px;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--paper)}
.tb-title{flex:1;min-width:0}
.tb-name{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:14px;color:var(--muted)}
.iconbtn{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.iconbtn.sm{width:38px;height:38px;border-radius:10px}
.iconbtn:active{background:var(--panel-2)}

/* hero (home) */
.hero{position:relative;overflow:hidden;margin-top:16px;border-radius:20px;background:var(--hero);color:var(--hero-ink)}
.court{position:absolute;left:0;top:0;width:100%;height:100%;color:#fff;opacity:.22}
.court *{vector-effect:non-scaling-stroke}
.hero-in{position:relative;padding:20px 20px 22px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:22px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--cork);color:var(--cork-ink);display:grid;place-items:center}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:.95;margin:34px 0 12px}
.hero p{font-size:16.5px;max-width:34ch;color:rgba(255,255,255,.9);margin-bottom:20px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;background:var(--court);color:var(--court-ink);font-weight:600;font-size:17px;white-space:nowrap;text-align:center}
.btn:active{filter:brightness(.92)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{display:flex;width:100%}
.btn.cork{background:var(--cork);color:var(--cork-ink)}
.btn.outline{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.outline-light{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6)}
.btn.danger{background:var(--neg-soft);color:var(--danger)}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.gap{margin-top:12px}
.link{padding:8px 10px;color:var(--court);font-weight:700;font-size:15px}

/* ledger rows */
.ledger{border:1.5px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;margin-top:12px}
.ledger>li+li{border-top:1px solid var(--line)}
.led-row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;background:transparent;color:inherit;min-height:64px}
button.led-row:active{background:var(--panel-2)}
.led-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.led-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:18px;line-height:1.2}
.led-sub{font-size:14px;color:var(--muted)}
.led-side{font-size:14px;color:var(--muted);white-space:nowrap}
.led-row .ic{color:var(--muted)}
.ev-ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--court-soft);color:var(--court);display:grid;place-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--cork);color:var(--cork-ink);font-size:12.5px;font-weight:700}
.led-row.exp{align-items:flex-start}
.exp-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.exp-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.exp-top .num{font-size:26px}
.exp-who{display:flex;align-items:center;gap:8px;font-size:15px}

/* avatars */
.h0{--h:12}.h1{--h:38}.h2{--h:92}.h3{--h:152}.h4{--h:188}.h5{--h:214}.h6{--h:268}.h7{--h:326}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:hsl(var(--h,150) var(--av-s) var(--av-l));color:hsl(var(--h,150) var(--av-ink-s) var(--av-ink-l))}
.avatar.sm{width:28px;height:28px;font-size:16px}
.avatar.xs{width:22px;height:22px;font-size:14px}

/* forms */
.addbox{margin-top:8px}
.lbl{display:block;font-size:14.5px;font-weight:600;color:var(--muted);margin:18px 0 6px}
.lbl-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:18px}
.lbl-row .lbl{margin:0 0 6px}
.input,.select,.textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px}
.textarea{resize:vertical;line-height:1.4}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.5}
.inline{display:flex;gap:10px}
.inline .input{flex:1;min-width:0}
.money{display:flex;align-items:center;gap:8px;padding:4px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel)}
.money:focus-within{outline:2.5px solid var(--court);outline-offset:2px}
.money .cur{font-family:var(--f-display);font-weight:700;font-size:30px;color:var(--muted)}
.money input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:40px;padding:4px 0;outline:none;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.tight{margin-top:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:8px -18px 0;padding:0 18px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px 0 7px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);font-weight:600;font-size:16px;color:var(--ink)}
.chip.on{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.chip.text{padding:0 14px}
.chip.text.sm{min-height:34px;font-size:14.5px;padding:0 12px;background:var(--panel-2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--panel-2);border:1.5px solid var(--line);margin-top:16px}
.seg button{min-height:44px;padding:0 10px;border-radius:10px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.seg button.on{background:var(--court);color:var(--court-ink)}

/* text blocks */
.sec{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:28px}
.prog{font-size:14px;color:var(--muted)}
.sub{font-family:var(--f-display);font-weight:700;font-size:21px;margin-top:18px}
.hint{font-size:14px;color:var(--muted);margin-top:10px}
.err{color:var(--danger);font-size:14.5px;font-weight:600;margin-top:8px}
.err:empty{display:none}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--court-soft);font-size:15px}
.note .ic{margin-top:2px;color:var(--court)}
.note.warn{background:var(--neg-soft)}
.note.warn .ic{color:var(--neg)}
.foot-note{margin-top:26px;font-size:13.5px;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:36px 4px 8px}
.empty-ic{width:52px;height:52px;border-radius:14px;background:var(--court-soft);color:var(--court);display:grid;place-items:center;margin-bottom:6px}
.empty h3{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05}
.empty p{color:var(--muted);max-width:34ch;margin-bottom:10px}

/* settle: the net band */
.net{margin-top:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.net-top{height:22px;border-top:5px solid var(--court);background-image:repeating-linear-gradient(45deg,transparent 0 6px,var(--line) 6px 7px),repeating-linear-gradient(-45deg,transparent 0 6px,var(--line) 6px 7px)}
.net-body{padding:12px 14px 14px}
.net-who{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
.net-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.net-stats .num{font-size:28px}
.net-note{font-size:14px;color:var(--muted);margin-top:10px}

/* settle: payments and balances */
.pay{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px;text-align:left;background:transparent;color:inherit}
.pay:active{background:var(--panel-2)}
.box{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.pay.done .box{background:var(--pos);border-color:var(--pos);color:var(--panel)}
.pay.done .pay-text{text-decoration:line-through;color:var(--muted)}
.pay.done .num{color:var(--muted)}
.pay-text{flex:1;min-width:0;font-size:17px}
.st{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.mini{display:flex;flex-wrap:wrap;column-gap:14px;row-gap:1px;font-size:13.5px;color:var(--muted)}
.mini b{color:var(--ink)}
.checks{margin-top:18px;padding:4px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 0;font-size:15px}
.ck+.ck{border-top:1px solid var(--line)}
.ck .ic{margin-top:2px}
.ck.ok .ic{color:var(--pos)}
.ck.bad .ic{color:var(--danger)}

/* tab bar and add button */
.tabbar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);padding:0 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1.5px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding-top:4px;color:var(--muted);font-size:13px;font-weight:600;box-shadow:inset 0 3px 0 transparent}
.tab.on{color:var(--court);box-shadow:inset 0 3px 0 var(--court)}
.fabwrap{position:fixed;left:0;right:0;margin:0 auto;max-width:520px;z-index:25;bottom:calc(78px + env(safe-area-inset-bottom,0px));padding:0 16px;display:flex;justify-content:flex-end;pointer-events:none}
.fab{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;min-height:54px;padding:0 20px;border-radius:16px;background:var(--cork);color:var(--cork-ink);font-weight:700;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* sheets */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,14,10,.55);animation:fade .18s ease-out}
.sheet{width:100%;max-width:520px;max-height:calc(100% - 12px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--panel);border-radius:22px 22px 0 0;animation:rise .22s cubic-bezier(.2,.8,.2,1)}
.grab{flex:none;width:38px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 18px 2px}
.sheet-head h2{font-family:var(--f-display);font-weight:700;font-size:28px}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:2px 18px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-foot{flex:none;display:grid;gap:10px;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--line);background:var(--panel)}
.foot-row{display:flex;gap:10px}
.foot-row>*{flex:1}
.preview{padding:10px 12px;border-radius:12px;background:var(--panel-2);border:1.5px dashed var(--line);font-size:15.5px;line-height:1.35}
.pv-sub{margin-top:3px;font-size:14px;color:var(--muted)}
.confirm-text{font-size:17px;padding:4px 0 8px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(28px)}to{transform:none}}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:22px;max-height:88%}}

/* toast */
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:14px;max-width:min(92%,460px);padding:12px 16px;border-radius:12px;background:var(--toast-bg);color:var(--toast-ink);font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast button{color:var(--toast-link);font-weight:700;font-size:15px;padding:4px 2px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<script>
(function(){
'use strict';

/*<logic>*/
function splitEqual(amount,ids){
  const n=ids.length,base=Math.floor(amount/n);
  let rem=amount-base*n;
  const out={};
  for(const id of ids){out[id]=base+(rem>0?1:0);if(rem>0)rem--;}
  return out;
}

/* Per person: what they paid, their share, what they spent on others (own share excluded),
   what others spent on them, and the net (= spent on others - others spent on them). */
function compute(ev){
  const r={paid:{},share:{},onOthers:{},onMe:{},net:{},total:0};
  for(const m of ev.members){r.paid[m.id]=0;r.share[m.id]=0;r.onOthers[m.id]=0;r.onMe[m.id]=0;}
  for(const e of ev.expenses){
    if(!(e.payer in r.paid))continue;
    const ids=Array.from(new Set(e.forIds)).filter(id=>id in r.paid);
    if(!ids.length)continue;
    const sh=splitEqual(e.amount,ids);
    let own=0;
    r.total+=e.amount;
    r.paid[e.payer]+=e.amount;
    for(const id of ids){
      r.share[id]+=sh[id];
      if(id===e.payer)own=sh[id];else r.onMe[id]+=sh[id];
    }
    r.onOthers[e.payer]+=e.amount-own;
  }
  for(const m of ev.members)r.net[m.id]=r.onOthers[m.id]-r.onMe[m.id];
  return r;
}

/* Everyone settles with the coordinator: debtors pay in, creditors are paid out. */
function planHub(ev,calc){
  const collect=[],payout=[],hub=ev.coordId;
  for(const m of ev.members){
    if(m.id===hub)continue;
    const n=calc.net[m.id];
    if(n<0)collect.push({from:m.id,to:hub,amt:-n});
    else if(n>0)payout.push({from:hub,to:m.id,amt:n});
  }
  return {collect,payout};
}

/* Fewest payments between members. Exact for up to 15 people with a non-zero balance:
   split them into the largest possible number of groups that already balance each other,
   then settle each group. */
function planDirect(ev,calc){
  const people=ev.members.filter(m=>calc.net[m.id]!==0).map(m=>m.id);
  const m=people.length,out=[];
  if(!m)return out;
  const vals=people.map(id=>calc.net[id]);
  const settle=idxs=>{
    const D=[],C=[];
    for(const i of idxs){
      if(vals[i]<0)D.push({id:people[i],amt:-vals[i]});
      else if(vals[i]>0)C.push({id:people[i],amt:vals[i]});
    }
    D.sort((a,b)=>b.amt-a.amt);C.sort((a,b)=>b.amt-a.amt);
    let i=0,j=0;
    while(i<D.length&&j<C.length){
      const t=Math.min(D[i].amt,C[j].amt);
      out.push({from:D[i].id,to:C[j].id,amt:t});
      D[i].amt-=t;C[j].amt-=t;
      if(D[i].amt===0)i++;
      if(C[j].amt===0)j++;
    }
  };
  if(m>15){settle(people.map((_,i)=>i));return out;}
  const size=1<<m,sum=new Float64Array(size),dp=new Int8Array(size),par=new Int8Array(size);
  for(let mask=1;mask<size;mask++){
    const low=mask&-mask,li=31-Math.clz32(low);
    sum[mask]=sum[mask^low]+vals[li];
    let best=-1,bi=0;
    for(let j=0;j<m;j++){
      if(mask&(1<<j)){const v=dp[mask^(1<<j)];if(v>best){best=v;bi=j;}}
    }
    dp[mask]=best+(sum[mask]===0?1:0);
    par[mask]=bi;
  }
  const seq=[];
  let mk=size-1;
  while(mk){const j=par[mk];seq.push(j);mk^=(1<<j);}
  seq.reverse();
  let cur=[],run=0;
  for(const i of seq){
    cur.push(i);run+=vals[i];
    if(run===0){settle(cur);cur=[];}
  }
  if(cur.length)settle(cur);
  return out;
}

/* Safety net: checks the plan against the numbers. */
function verify(ev,calc,transfers,hubId){
  const inn={},out={};
  for(const m of ev.members){inn[m.id]=0;out[m.id]=0;}
  for(const t of transfers){out[t.from]+=t.amt;inn[t.to]+=t.amt;}
  let balanced=true,capped=true;
  for(const m of ev.members){
    const netIn=inn[m.id]-out[m.id];
    if(netIn!==calc.net[m.id])balanced=false;
    if(netIn>calc.onOthers[m.id])capped=false;
    if(m.id!==hubId&&inn[m.id]>calc.onOthers[m.id])capped=false;
  }
  return {balanced,capped};
}

/* "1,400" -> 140000, "12,5" -> 1250, "₹99.99" -> 9999. Returns minor units (paise/cents) or NaN. */
function parseAmount(str){
  let s=String(str==null?'':str).replace(/[^\d.,]/g,'');
  if(!s)return NaN;
  const commas=(s.match(/,/g)||[]).length;
  if(s.indexOf('.')<0&&commas===1&&/,\d{1,2}$/.test(s))s=s.replace(',','.');
  else s=s.replace(/,/g,'');
  if(!/^\d*\.?\d*$/.test(s)||!/\d/.test(s))return NaN;
  const parts=s.split('.'),w=parts[0]||'0',f=parts[1]||'';
  let minor=parseInt(w,10)*100+parseInt((f+'00').slice(0,2),10);
  if(f.length>2&&f.charAt(2)>='5')minor+=1;
  return isFinite(minor)?minor:NaN;
}

function normEvent(e){
  if(!e||typeof e!=='object')return null;
  const members=(Array.isArray(e.members)?e.members:[]).filter(m=>m&&m.id&&m.name).map((m,i)=>({id:String(m.id),name:String(m.name).slice(0,24),h:Number.isInteger(m.h)?((m.h%HUES)+HUES)%HUES:i%HUES}));
  if(!members.length)return null;
  const ids=new Set(members.map(m=>m.id));
  const expenses=(Array.isArray(e.expenses)?e.expenses:[])
    .filter(x=>x&&ids.has(x.payer)&&Number.isFinite(x.amount)&&x.amount>0&&Array.isArray(x.forIds))
    .map(x=>({id:String(x.id||uid()),title:String(x.title||'Expense').slice(0,40),amount:Math.round(x.amount),payer:x.payer,forIds:Array.from(new Set(x.forIds.filter(i=>ids.has(i)))),at:Number(x.at)||Date.now()}))
    .filter(x=>x.forIds.length);
  return {id:String(e.id||uid()),name:String(e.name||'Event').slice(0,40),currency:typeof e.currency==='string'?e.currency:'₹',createdAt:Number(e.createdAt)||Date.now(),coordId:ids.has(e.coordId)?e.coordId:members[0].id,members,expenses,mode:e.mode==='direct'?'direct':'hub',done:(e.done&&typeof e.done==='object')?e.done:{}};
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const d=JSON.parse(raw);
      if(d&&Array.isArray(d.events)){
        S=Object.assign(S,d);
        S.events=S.events.map(normEvent).filter(Boolean);
      }
    }
  }catch(e){}
  try{localStorage.setItem('__evenly_t','1');localStorage.removeItem('__evenly_t');}catch(e){storageOk=false;}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOk=false;}}

const mem=(ev,id)=>ev.members.find(m=>m.id===id);
const nm=(ev,id)=>{const m=mem(ev,id);return m?m.name:'?';};

function fmt(minor,cur){
  const a=Math.abs(minor),frac=a%100;
  const num=(a/100).toLocaleString(undefined,{minimumFractionDigits:frac?2:0,maximumFractionDigits:2});
  const c=cur==null?'':cur;
  const body=c.length>1?c+'\u00A0'+num:c+num;
  return (minor<0?'\u2212':'')+body;
}
const M=(ev,minor)=>fmt(minor,ev.currency);
const initial=n=>{const t=Array.from(String(n).trim())[0]||'?';return t.toUpperCase();};
const avatar=(m,cls)=>`<span class="avatar h${m?m.h:0} ${cls||''}" aria-hidden="true">${esc(initial(m?m.name:'?'))}</span>`;
const ledger=rows=>`<ul class="ledger">${rows.map(r=>`<li>${r}</li>`).join('')}</ul>`;
const emptyBlock=(ic,title,text,action)=>`<div class="empty"><div class="empty-ic">${icon(ic,26)}</div><h3>${title}</h3><p>${text}</p>${action||''}</div>`;
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const tkey=(hubOn,t)=>(hubOn?'h':'d')+'_'+t.from+'_'+t.to+'_'+t.amt;

function eachLabel(ev,amount,ids){
  const vals=Object.values(splitEqual(amount,ids)),lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  return lo===hi?M(ev,lo):M(ev,lo)+' to '+M(ev,hi);
}
function forLabel(ev,e){
  if(e.forIds.length===ev.members.length)return 'everyone ('+e.forIds.length+')';
  return e.forIds.map(id=>nm(ev,id)).join(', ');
}
function getPlan(ev,calc){
  const hubOn=ev.mode!=='direct';
  if(hubOn){
    const p=planHub(ev,calc);
    return {hubOn,collect:p.collect,payout:p.payout,transfers:p.collect.concat(p.payout)};
  }
  const ord=id=>ev.members.findIndex(m=>m.id===id);
  const t=planDirect(ev,calc).sort((a,b)=>ord(a.from)-ord(b.from)||b.amt-a.amt);
  return {hubOn,collect:[],payout:[],transfers:t};
}

function settleView(ev,calc){
  if(!ev.expenses.length)return emptyBlock('repeat','Nothing to settle yet','Add the first expense: who paid, how much, and who it was for.',`<button class="btn" data-act="tab" data-tab="expenses">Go to expenses</button>`);
  const P=getPlan(ev,calc),hubOn=P.hubOn,hub=ev.coordId,c=esc(nm(ev,hub));
  const total=P.transfers.length,doneN=P.transfers.filter(t=>ev.done[tkey(hubOn,t)]).length;
  const chk=verify(ev,calc,P.transfers,hubOn?hub:null);
  const seg=`<div class="seg" role="group" aria-label="How to settle"><button class="${hubOn?'on':''}" data-act="mode" data-mode="hub" aria-pressed="${hubOn}">Via ${c}</button><button class="${hubOn?'':'on'}" data-act="mode" data-mode="direct" aria-pressed="${!hubOn}">Direct</button></div>`;
  const desc=hubOn
    ?`Everyone who owes pays ${c}, then ${c} pays everyone who is owed. What ${c} spent on others, and what others spent on ${c}, is already counted.`
    :`Members pay each other directly, using the fewest payments. Each person only pays or only receives.`;
  const payRow=t=>{
    const k=tkey(hubOn,t),d=!!ev.done[k],who=(hubOn&&t.from===hub)?t.to:t.from;
    return `<button class="pay ${d?'done':''}" data-act="toggleDone" data-key="${k}" aria-pressed="${d}"><span class="box">${icon('check',16)}</span>${avatar(mem(ev,who),'sm')}<span class="pay-text"><b>${esc(nm(ev,t.from))}</b> pays <b>${esc(nm(ev,t.to))}</b></span><span class="num">${M(ev,t.amt)}</span></button>`;
  };
  let pay='';
  if(!total){
    pay=`<div class="note">${icon('check',18)}<span>All square. Nobody owes anyone.</span></div>`;
  }else if(hubOn){
    const D=P.collect.reduce((s,t)=>s+t.amt,0),C=P.payout.reduce((s,t)=>s+t.amt,0),hn=calc.net[hub];
    let own;
    if(hn>0)own=`${c} keeps ${M(ev,hn)}: ${M(ev,calc.onOthers[hub])} spent on others, minus ${M(ev,calc.onMe[hub])} others spent on ${c}.`;
    else if(hn<0)own=`${c} puts in ${M(ev,-hn)}: ${M(ev,calc.onMe[hub])} others spent on ${c}, minus ${M(ev,calc.onOthers[hub])} spent on others.`;
    else own=`${c} ends up even: what comes in equals what goes out.`;
    const net=`<div class="net" role="group" aria-label="${c} in the middle"><div class="net-top" aria-hidden="true"></div><div class="net-body">
      <div class="net-who">${avatar(mem(ev,hub))}<span>${c} collects, then pays out</span></div>
      <div class="net-stats">
        <div><span class="k">Collects</span><span class="num">${M(ev,D)}</span></div>
        <div><span class="k">Pays out</span><span class="num">${M(ev,C)}</span></div>
        <div><span class="k">${hn<0?'Puts in':'Keeps'}</span><span class="num ${hn<0?'neg':'pos'}">${M(ev,Math.abs(hn))}</span></div>
      </div>
      <p class="net-note">${own}</p></div></div>`;
    if(P.collect.length)pay+=`<h3 class="sub">Pay ${c}</h3>${ledger(P.collect.map(payRow))}`;
    pay+=net;
    if(P.payout.length)pay+=`<h3 class="sub">${c} pays</h3>${ledger(P.payout.map(payRow))}`;
    pay+=`<p class="hint">Collect first, then pay out. Tap a payment to tick it off once it is done.</p>`;
  }else{
    pay=ledger(P.transfers.map(payRow))+`<p class="hint">Tap a payment to tick it off once it is done.</p>`;
  }
  const bal=ev.members.map(m=>{
    const n=calc.net[m.id];
    const st=n>0?`<span class="st pos"><span class="k">gets</span><span class="num">${M(ev,n)}</span></span>`
      :n<0?`<span class="st neg"><span class="k">owes</span><span class="num">${M(ev,-n)}</span></span>`
      :`<span class="st"><span class="k">even</span></span>`;
    return `<div class="led-row">${avatar(m)}<span class="led-main"><span class="led-title">${esc(m.name)}${m.id===hub?`<span class="tag">${icon('crown',12)}Coordinator</span>`:''}</span><span class="mini"><span>Spent on others <b>${M(ev,calc.onOthers[m.id])}</b></span><span>Others spent on them <b>${M(ev,calc.onMe[m.id])}</b></span></span></span>${st}</div>`;
  });
  const ck=(ok,good,bad)=>`<div class="ck ${ok?'ok':'bad'}">${icon(ok?'check':'alert',18)}<span>${ok?good:bad}</span></div>`;
  return `${seg}<p class="hint">${desc}</p>
    <div class="sec-row"><h2 class="sec">Who pays whom</h2><span class="prog">${total?`${doneN} of ${total} done`:''}</span></div>
    ${pay}
    <div class="checks">${ck(chk.balanced,'Every person ends up exactly even.','The payments do not add up. Check the expenses.')}${ck(chk.capped,'Nobody gets back more than they spent on others.','Someone would get back more than they spent on others. Check the expenses.')}</div>
    <div class="sec-row"><h2 class="sec">Balances</h2><span class="prog">${M(ev,calc.total)} spent</span></div>
    ${ledger(bal)}
    <button class="btn outline block gap" style="margin-top:20px" data-act="share">${icon('share',18)}Share summary</button>`;
}

function summaryText(ev){
  const calc=compute(ev),P=getPlan(ev,calc),c=nm(ev,ev.coordId),L=[];
  L.push(ev.name+': settle up');
  L.push('Total spent: '+M(ev,calc.total)+' on '+plural(ev.expenses.length,'expense'));
  L.push('');
  if(!P.transfers.length){L.push('All square. Nobody owes anyone.');L.push('');}
  else if(P.hubOn){
    if(P.collect.length){L.push('Pay '+c+':');P.collect.forEach(t=>L.push('- '+nm(ev,t.from)+': '+M(ev,t.amt)));L.push('');}
    if(P.payout.length){L.push(c+' pays:');P.payout.forEach(t=>L.push('- '+nm(ev,t.to)+': '+M(ev,t.amt)));L.push('');}
  }else{
    L.push('Payments:');
    P.transfers.forEach(t=>L.push('- '+nm(ev,t.from)+' pays '+nm(ev,t.to)+': '+M(ev,t.amt)));
    L.push('');
  }
  L.push('Expenses:');
  ev.expenses.forEach(e=>L.push('- '+e.title+', '+M(ev,e.amount)+', paid by '+nm(ev,e.payer)+', for '+forLabel(ev,e)));
  return L.join('\n');
}

};

function newEventSheet(){
  const reuse=S.events.length?`<label class="lbl" for="neReuse">Reuse people from</label><select id="neReuse" class="select" data-field="reuse"><option value="">Start fresh</option>${S.events.map(e=>`<option value="${e.id}">${esc(e.name)} (${e.members.length})</option>`).join('')}</select>`:'';
  const body=`<label class="lbl" for="neName">Event name</label>
    <input id="neName" class="input" maxlength="40" placeholder="Badminton Sunday" autocomplete="off" data-enter="#createEvent">
    <label class="lbl" for="neCoord">Coordinator (collects and pays out)</label>
    <input id="neCoord" class="input" maxlength="24" value="${esc(S.lastCoord)}" autocomplete="off">
    ${reuse}
    <label class="lbl" for="neOthers">Other people, separated by commas</label>
    <textarea id="neOthers" class="textarea" rows="3" placeholder="Anees, Riya, Sam"></textarea>
    <label class="lbl" for="neCur">Currency</label>
    <select id="neCur" class="select">${curOptions(S.lastCur)}</select>`;
  return shell('New event',body,`<button class="btn block" id="createEvent" data-act="createEvent">Create event</button>`);
}

function expenseDraft(ev,e){
  if(e)return {id:e.id,title:e.title,amountStr:String(e.amount/100),payer:e.payer,forIds:e.forIds.slice()};
  return {id:null,title:'',amountStr:'',payer:null,forIds:ev.members.map(m=>m.id)};
}

function previewHtml(ev,d){
  const amt=parseAmount(d.amountStr),n=d.forIds.length;
  if(!(amt>0)||!n)return '<span class="muted">Enter the amount and pick who it was for to see the split.</span>';
  const sh=splitEqual(amt,d.forIds),each=eachLabel(ev,amt,d.forIds);
  let out=`<div><b>${M(ev,amt)}</b> split ${n} way${n===1?'':'s'}: <b>${each}</b>${n>1?' each':''}</div>`;
  if(d.payer){
    const p=esc(nm(ev,d.payer));
    if(d.forIds.indexOf(d.payer)>=0){
      const own=sh[d.payer],back=amt-own;
      out+=back>0?`<div class="pv-sub">${p}'s own share (${M(ev,own)}) is not paid back, so ${p} gets back ${M(ev,back)}.</div>`:`<div class="pv-sub">Only for ${p}, so there is nothing to get back.</div>`;
    }else out+=`<div class="pv-sub">${p} is not in the split, so ${p} gets back the full ${M(ev,amt)}.</div>`;
  }else out+='<div class="pv-sub">Pick who paid.</div>';
  return out;
}

function expenseSheet(ev,d){
  const edit=!!d.id;
  const chip=(m,act,on)=>`<button type="button" class="chip ${on?'on':''}" data-act="${act}" data-id="${m.id}" aria-pressed="${on}">${avatar(m,'sm')}<span>${esc(m.name)}</span></button>`;
  const quick=['Court','Transport','Food','Snacks','Drinks','Stay','Fuel','Tickets'].map(t=>`<button type="button" class="chip text sm" data-act="quickTitle" data-t="${t}">${t}</button>`).join('');
  const body=`<label class="lbl" for="fAmount">Amount</label>
    <div class="money"><span class="cur">${esc(ev.currency)}</span><input id="fAmount" data-field="amount" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(d.amountStr)}"></div>
    <label class="lbl" for="fTitle">What was it for?</label>
    <input id="fTitle" class="input" data-field="title" maxlength="40" autocomplete="off" placeholder="Court booking" value="${esc(d.title)}">
    <div class="chips tight scroll">${quick}</div>
    <div class="lbl">Who paid?</div>
    <div class="chips">${ev.members.map(m=>chip(m,'pickPayer',d.payer===m.id)).join('')}</div>
    <div class="lbl-row"><span class="lbl">Split between <span id="forCount" class="muted">(${d.forIds.length} of ${ev.members.length})</span></span><span><button type="button" class="link" data-act="forAll">All</button><button type="button" class="link" data-act="forNone">None</button></span></div>
    <div class="chips">${ev.members.map(m=>chip(m,'toggleFor',d.forIds.indexOf(m.id)>=0)).join('')}</div>
    <p class="hint">Tick everyone who shared this cost. Include the payer only if they used it too.</p>
    ${edit?`<div class="foot-row" style="margin-top:18px"><button class="btn outline sm" data-act="dupExpense">${icon('copy',16)}Duplicate</button><button class="btn danger sm" data-act="delExpense">${icon('trash',16)}Delete</button></div>`:''}`;
  const foot=`<div id="expPreview" class="preview" aria-live="polite">${previewHtml(ev,d)}</div>
    <p class="err" id="expErr" role="alert"></p>
    <button class="btn block" data-act="saveExpense">${edit?'Save changes':'Add expense'}</button>`;
  return shell(edit?'Edit expense':'Add expense',body,foot);
}

function memberSheet(ev,id){
  const m=mem(ev,id);if(!m)return '';
  const used=ev.expenses.filter(e=>e.payer===id||e.forIds.indexOf(id)>=0).length;
  const isC=id===ev.coordId;
  let note='',can=true;
  if(isC){can=false;note='Make someone else the coordinator before removing this person.';}
  else if(used){can=false;note=`${esc(m.name)} is in ${plural(used,'expense')}. Edit or delete those first.`;}
  const body=`<label class="lbl" for="mName">Name</label>
    <input id="mName" class="input" maxlength="24" value="${esc(m.name)}" autocomplete="off" data-enter="#saveMember">
    <p class="err" id="mErr" role="alert"></p>
    ${isC?`<div class="note">${icon('crown',16)}<span>${esc(m.name)} is the coordinator: the one who collects and pays out in Via ${esc(m.name)} mode.</span></div>`:`<button class="btn outline block gap" data-act="makeCoord" data-id="${m.id}">${icon('crown',18)}Make coordinator</button>`}
    <button class="btn danger block gap" data-act="askRemoveMember" data-id="${m.id}" ${can?'':'disabled'}>${icon('trash',18)}Remove person</button>
    ${note?`<p class="hint">${note}</p>`:''}`;
  return shell('Edit person',body,`<button class="btn block" id="saveMember" data-act="saveMember" data-id="${m.id}">Save name</button>`);
}

function settingsSheet(ev){
  const body=`<label class="lbl" for="sName">Event name</label>
    <input id="sName" class="input" maxlength="40" value="${esc(ev.name)}" autocomplete="off" data-enter="#saveSettings">
    <label class="lbl" for="sCur">Currency</label>
    <select id="sCur" class="select">${curOptions(ev.currency)}</select>
    <button class="btn danger block gap" style="margin-top:24px" data-act="askDeleteEvent">${icon('trash',18)}Delete event</button>`;
  return shell('Event settings',body,`<button class="btn block" id="saveSettings" data-act="saveSettings">Save changes</button>`);
}

function confirmSheet(sh){
  return shell(sh.title,`<p class="confirm-text">${esc(sh.text)}</p>`,`<div class="foot-row"><button class="btn outline" data-act="closeSheet">Cancel</button><button class="btn danger" data-act="confirmYes">${esc(sh.label||'Confirm')}</button></div>`);
}

function shareSheet(ev){
  const canShare=typeof navigator!=='undefined'&&!!navigator.share;
  const body=`<p class="hint" style="margin-top:0">Copy this into your group chat.</p><textarea id="shareText" class="textarea mono" rows="12" readonly style="margin-top:10px">${esc(summaryText(ev))}</textarea>`;
  const foot=`<div class="foot-row"><button class="btn" data-act="copy">${icon('copy',18)}Copy</button>${canShare?`<button class="btn outline" data-act="nativeShare">${icon('share',18)}Share</button>`:''}</div>`;
  return shell('Share summary',body,foot);
}

function renderSheet(){
  const root=$('#sheetRoot'),sh=ui.sheet;
  if(!sh){root.innerHTML='';return;}
  const ev=curEv();
  let html='';
  if(sh.type==='newEvent')html=newEventSheet();
  else if(sh.type==='expense'&&ev)html=expenseSheet(ev,sh.draft);
  else if(sh.type==='member'&&ev)html=memberSheet(ev,sh.id);
  else if(sh.type==='settings'&&ev)html=settingsSheet(ev);
  else if(sh.type==='confirm')html=confirmSheet(sh);
  else if(sh.type==='share'&&ev)html=shareSheet(ev);
  root.innerHTML=html;
}
function lock(on){document.documentElement.style.overflow=on?'hidden':'';}
function openSheet(sh,focusSel){
  ui.sheet=sh;renderSheet();lock(true);
  if(focusSel)setTimeout(()=>{const el=$(focusSel);if(el){el.focus();try{if(el.tagName==='INPUT'&&el.value)el.select();}catch(e){}}},40);
}
function closeSheet(){ui.sheet=null;ui.confirmFn=null;$('#sheetRoot').innerHTML='';lock(false);}

let toastT=null;
function toast(msg,action){
  const r=$('#toastRoot');clearTimeout(toastT);
  r.innerHTML=`<div class="toast"><span>${esc(msg)}</span>${action?`<button data-act="toastAction">${esc(action.label)}</button>`:''}</div>`;
  ui.toastAction=action?action.fn:null;
  toastT=setTimeout(()=>{r.innerHTML='';ui.toastAction=null;},action?6000:2400);
}
function setErr(sel,msg){const el=$(sel);if(el)el.textContent=msg;}

const app=$('#app');
function render(){const ev=curEv();app.innerHTML=ev?eventView(ev):homeView();}

/* ---------- expense sheet helpers ---------- */
function syncExpense(){
  const ev=curEv(),d=ui.sheet&&ui.sheet.draft;
  if(!ev||!d)return;
  document.querySelectorAll('[data-act="pickPayer"]').forEach(b=>{const on=b.dataset.id===d.payer;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});
  document.querySelectorAll('[data-act="toggleFor"]').forEach(b=>{const on=d.forIds.indexOf(b.dataset.id)>=0;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});
  const c=$('#forCount');if(c)c.textContent='('+d.forIds.length+' of '+ev.members.length+')';
  const p=$('#expPreview');if(p)p.innerHTML=previewHtml(ev,d);
  setErr('#expErr','');
}

/* ---------- actions ---------- */
function parseNames(raw){
  const out=[];
  String(raw||'').split(/[,\n;]+/).map(s=>s.trim().slice(0,24)).filter(Boolean).forEach(n=>{if(!out.some(x=>x.toLowerCase()===n.toLowerCase()))out.push(n);});
  return out;
}
function makeEvent(name,currency,names,extra){
  const members=names.map((n,i)=>({id:uid(),name:n,h:i%HUES}));
  const ev=Object.assign({id:uid(),name,currency,createdAt:Date.now(),coordId:members[0].id,members,expenses:[],mode:'hub',done:{}},extra||{});
  return ev;
}

const ACT={
  home(){S.currentId=null;save();render();window.scrollTo(0,0);},
  openEvent(t){
    S.currentId=t.dataset.id;const ev=curEv();
    S.tab=ev&&ev.members.length>1?'expenses':'people';
    save();render();window.scrollTo(0,0);
  },
  tab(t){S.tab=t.dataset.tab;save();render();window.scrollTo(0,0);},
  newEvent(){openSheet({type:'newEvent'},'#neName');},
  createEvent(){
    const name=($('#neName').value||'').trim().slice(0,40)||'New event';
    const coord=($('#neCoord').value||'').trim().slice(0,24)||'Jinan';
    const cur=$('#neCur').value;
    const names=[coord];
    parseNames($('#neOthers').value).forEach(n=>{if(!names.some(x=>x.toLowerCase()===n.toLowerCase()))names.push(n);});
    const ev=makeEvent(name,cur,names);
    S.events.push(ev);S.currentId=ev.id;S.lastCoord=coord;S.lastCur=cur;
    S.tab=names.length>1?'expenses':'people';
    save();closeSheet();render();window.scrollTo(0,0);
  },
  sample(){
    const names=['Jinan','Anees','Farhan','Meera','Sam','Nadia','Joel'];
    const ev=makeEvent('Badminton day (sample)',S.lastCur||'₹',names);
    const id=n=>ev.members.find(m=>m.name===n).id,all=ev.members.map(m=>m.id);
    const ex=(title,amt,payer,forNames)=>({id:uid(),title,amount:amt*100,payer:id(payer),forIds:forNames?forNames.map(id):all.slice(),at:Date.now()});
    ev.expenses=[
      ex('Court booking',2100,'Jinan'),
      ex('Transport up',900,'Anees',['Anees','Sam','Nadia']),
      ex('Transport down',1800,'Anees',['Anees','Farhan','Meera','Sam','Nadia','Joel']),
      ex('Lunch',500,'Farhan',['Farhan','Jinan']),
      ex('Dinner',1200,'Meera',['Meera','Nadia','Joel','Anees'])
    ];
    S.events.push(ev);S.currentId=ev.id;S.tab='settle';
    save();render();window.scrollTo(0,0);
  },
  addMembers(){
    const ev=curEv(),inp=$('#newMember');if(!ev||!inp)return;
    const names=parseNames(inp.value);
    if(!names.length){setErr('#memberErr','Type a name first.');return;}
    const dup=[];
    names.forEach(n=>{
      if(ev.members.some(m=>m.name.toLowerCase()===n.toLowerCase()))dup.push(n);
      else ev.members.push({id:uid(),name:n,h:ev.members.length%HUES});
    });
    save();render();
    const i2=$('#newMember');
    if(dup.length){setErr('#memberErr','Already in this event: '+dup.join(', ')+'.');if(i2)i2.value=dup.join(', ');}
    if(i2)i2.focus();
  },
  editMember(t){openSheet({type:'member',id:t.dataset.id},'#mName');},
  saveMember(t){
    const ev=curEv(),m=ev&&mem(ev,t.dataset.id),inp=$('#mName');if(!m||!inp)return;
    const name=inp.value.trim().slice(0,24);
    if(!name){setErr('#mErr','Enter a name.');return;}
    if(ev.members.some(x=>x.id!==m.id&&x.name.toLowerCase()===name.toLowerCase())){setErr('#mErr','Someone in this event already has that name.');return;}
    m.name=name;save();closeSheet();render();toast('Name saved');
  },
  makeCoord(t){
    const ev=curEv();if(!ev)return;
    ev.coordId=t.dataset.id;save();closeSheet();render();toast(nm(ev,ev.coordId)+' is now the coordinator');
  },
  askRemoveMember(t){
    const ev=curEv(),m=ev&&mem(ev,t.dataset.id);if(!m)return;
    ui.confirmFn=()=>{ev.members=ev.members.filter(x=>x.id!==m.id);save();render();toast('Person removed');};
    const fn=ui.confirmFn;
    openSheet({type:'confirm',title:'Remove person?',text:'Remove '+m.name+' from this event?',label:'Remove person'});
    ui.confirmFn=fn;
  },
  addExpense(){
    const ev=curEv();if(!ev)return;
    if(ev.members.length<2){toast('Add at least two people first');S.tab='people';save();render();return;}
    openSheet({type:'expense',draft:expenseDraft(ev,null)},'#fAmount');
  },
  editExpense(t){
    const ev=curEv(),e=ev&&ev.expenses.find(x=>x.id===t.dataset.id);if(!e)return;
    openSheet({type:'expense',draft:expenseDraft(ev,e)});
  },
  pickPayer(t){ui.sheet.draft.payer=t.dataset.id;syncExpense();},
  toggleFor(t){
    const d=ui.sheet.draft,id=t.dataset.id,i=d.forIds.indexOf(id);
    if(i>=0)d.forIds.splice(i,1);else d.forIds.push(id);
    syncExpense();
  },
  forAll(){const ev=curEv();ui.sheet.draft.forIds=ev.members.map(m=>m.id);syncExpense();},
  forNone(){ui.sheet.draft.forIds=[];syncExpense();},
  quickTitle(t){const d=ui.sheet.draft;d.title=t.dataset.t;const i=$('#fTitle');if(i)i.value=d.title;},
  saveExpense(){
    const ev=curEv(),d=ui.sheet&&ui.sheet.draft;if(!ev||!d)return;
    const amt=parseAmount(d.amountStr);
    let err='';
    if(!(amt>0))err='Enter the amount.';
    else if(amt>1e11)err='That amount is too large.';
    else if(!d.payer)err='Choose who paid.';
    else if(!d.forIds.length)err='Choose at least one person to split between.';
    if(err){setErr('#expErr',err);return;}
    const ids=ev.members.filter(m=>d.forIds.indexOf(m.id)>=0).map(m=>m.id);
    const rec={id:d.id||uid(),title:(d.title||'').trim().slice(0,40)||'Expense',amount:amt,payer:d.payer,forIds:ids,at:Date.now()};
    const wasEdit=!!d.id;
    if(wasEdit){
      const i=ev.expenses.findIndex(x=>x.id===d.id);
      if(i>=0){rec.at=ev.expenses[i].at;ev.expenses[i]=rec;}else ev.expenses.push(rec);
    }else ev.expenses.push(rec);
    save();closeSheet();render();toast(wasEdit?'Changes saved':'Expense added');
  },
  dupExpense(){
    const ev=curEv(),d=ui.sheet.draft;
    openSheet({type:'expense',draft:{id:null,title:d.title,amountStr:d.amountStr,payer:d.payer,forIds:d.forIds.slice()}},'#fAmount');
  },
  delExpense(){
    const ev=curEv(),d=ui.sheet.draft;
    const i=ev.expenses.findIndex(x=>x.id===d.id);if(i<0)return;
    const rec=ev.expenses.splice(i,1)[0];
    save();closeSheet();render();
    toast('Expense deleted',{label:'Undo',fn:()=>{ev.expenses.splice(Math.min(i,ev.expenses.length),0,rec);save();render();}});
  },
  mode(t){const ev=curEv();ev.mode=t.dataset.mode==='direct'?'direct':'hub';save();render();},
  toggleDone(t){
    const ev=curEv(),k=t.dataset.key;
    if(ev.done[k])delete ev.done[k];else ev.done[k]=1;
    save();render();
  },
  share(){openSheet({type:'share'});},
  copy(){doCopy();},
  nativeShare(){doShare();},
  eventSettings(){openSheet({type:'settings'},'#sName');},
  saveSettings(){
    const ev=curEv();if(!ev)return;
    const name=($('#sName').value||'').trim().slice(0,40);
    if(name)ev.name=name;
    ev.currency=$('#sCur').value;S.lastCur=ev.currency;
    save();closeSheet();render();toast('Changes saved');
  },
  askDeleteEvent(){
    const ev=curEv();if(!ev)return;
    const fn=()=>{S.events=S.events.filter(e=>e.id!==ev.id);S.currentId=null;save();render();window.scrollTo(0,0);toast('Event deleted');};
    openSheet({type:'confirm',title:'Delete event?',text:'This deletes '+ev.name+' and all of its expenses. This cannot be undone.',label:'Delete event'});
    ui.confirmFn=fn;
  },
  confirmYes(){const fn=ui.confirmFn;closeSheet();if(fn)fn();},
  closeSheet(){closeSheet();},
  toastAction(){const fn=ui.toastAction;$('#toastRoot').innerHTML='';ui.toastAction=null;if(fn)fn();}
};

async function doCopy(){
  const ta=$('#shareText');if(!ta)return;
  const text=ta.value;let ok=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);ok=true;}}catch(e){}
  if(!ok){try{ta.focus();ta.select();ta.setSelectionRange(0,text.length);ok=document.execCommand('copy');}catch(e){}}
  toast(ok?'Copied to clipboard':'Select the text and copy it by hand');
}
async function doShare(){
  const ta=$('#shareText');if(!ta)return;
  try{await navigator.share({text:ta.value});}
  catch(e){if(!e||e.name!=='AbortError')doCopy();}
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='backdrop'){if(e.target===t)closeSheet();return;}
  const fn=ACT[a];if(fn)fn(t,e);
});
document.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.field;if(!f)return;
  const d=ui.sheet&&ui.sheet.draft,ev=curEv();
  if(!d||!ev)return;
  if(f==='amount'){
    const v=e.target.value.replace(/[^\d.,\s]/g,'');
    if(v!==e.target.value)e.target.value=v;
    d.amountStr=v;
  }else if(f==='title'){d.title=e.target.value;}
  const p=$('#expPreview');if(p)p.innerHTML=previewHtml(ev,d);
  setErr('#expErr','');
});
document.addEventListener('change',e=>{
  if(e.target.dataset&&e.target.dataset.field==='reuse'){
    const src=S.events.find(x=>x.id===e.target.value),ta=$('#neOthers'),co=($('#neCoord').value||'').trim().toLowerCase();
    if(src&&ta)ta.value=src.members.map(m=>m.name).filter(n=>n.toLowerCase()!==co).join(', ');
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.sheet){closeSheet();return;}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){
    e.preventDefault();
    const b=$(e.target.dataset.enter);if(b)b.click();
  }
});

load();
render();
})();
</script>
</body>
</html>
