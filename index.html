<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-rMCSJ5icgaJbbP7VRrnJ2MJfeZurbjHOSc2ygEOtjlQ='; style-src 'sha256-hAoo933TO/p5xEAF8KV3KKjPLJdBUDC4OHGh9xvXZnE='; img-src blob: data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Evenly: split group costs fairly</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E">
<style>
:root{
  --paper:#EEF3EF;--panel:#FFFFFF;--panel-2:#F5F8F6;--ink:#0E241C;--muted:#4F6B5F;--line:#C9D8CF;
  --court:#0D6A54;--court-ink:#FFFFFF;--court-soft:#DCEBE3;
  --cork:#F2A93B;--cork-ink:#2B1B00;
  --pos:#0D6A54;--neg:#B3302A;--neg-soft:#F8E1DE;--danger:#B3302A;
  --hero:#0D6A54;--hero-ink:#FFFFFF;
  --toast-bg:#0E241C;--toast-ink:#EEF3EF;--toast-link:#F2A93B;
  --av-s:55%;--av-l:84%;--av-ink-s:50%;--av-ink-l:22%;
  --f-display:"Barlow Condensed","Avenir Next Condensed","HelveticaNeue-CondensedBold","Roboto Condensed","Arial Narrow",sans-serif-condensed,"Helvetica Neue",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0A1612;--panel:#11231C;--panel-2:#15291F;--ink:#E6F1EA;--muted:#8FAA9C;--line:#26443A;
    --court:#4CCBA2;--court-ink:#04231A;--court-soft:#163529;
    --cork:#F2A93B;--cork-ink:#2B1B00;
    --pos:#5DDBB0;--neg:#FF9385;--neg-soft:#3B1F1C;--danger:#FF9385;
    --hero:#0F4B3C;--hero-ink:#F1F8F4;
    --toast-bg:#E6F1EA;--toast-ink:#0A1612;--toast-link:#0D6A54;
    --av-s:32%;--av-l:27%;--av-ink-s:60%;--av-ink-l:86%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1612;--panel:#11231C;--panel-2:#15291F;--ink:#E6F1EA;--muted:#8FAA9C;--line:#26443A;
  --court:#4CCBA2;--court-ink:#04231A;--court-soft:#163529;
  --cork:#F2A93B;--cork-ink:#2B1B00;
  --pos:#5DDBB0;--neg:#FF9385;--neg-soft:#3B1F1C;--danger:#FF9385;
  --hero:#0F4B3C;--hero-ink:#F1F8F4;
  --toast-bg:#E6F1EA;--toast-ink:#0A1612;--toast-link:#0D6A54;
  --av-s:32%;--av-l:27%;--av-ink-s:60%;--av-ink-l:86%;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{background:var(--paper);-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2.5px solid var(--court);outline-offset:2px}
b{font-weight:700}
.muted{color:var(--muted)}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.k{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.num{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;white-space:nowrap}
.ic{flex:none}

.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.screen{padding-bottom:calc(128px + env(safe-area-inset-bottom,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 0;background:var(--paper)}
.topbar::before{content:"";position:absolute;left:-16px;right:-16px;bottom:100%;height:env(safe-area-inset-top,0px);background:var(--paper)}
.tb-title{flex:1;min-width:0}
.tb-name{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:14px;color:var(--muted)}
.iconbtn{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.iconbtn.sm{width:38px;height:38px;border-radius:10px}
.iconbtn:active{background:var(--panel-2)}

/* hero (home) */
.hero{position:relative;overflow:hidden;margin-top:16px;border-radius:20px;background:var(--hero);color:var(--hero-ink)}
.court{position:absolute;left:0;top:0;width:100%;height:100%;color:#fff;opacity:.22}
.court *{vector-effect:non-scaling-stroke}
.hero-in{position:relative;padding:20px 20px 22px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:22px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--cork);color:var(--cork-ink);display:grid;place-items:center}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:.95;margin:34px 0 12px}
.hero p{font-size:16.5px;max-width:34ch;color:rgba(255,255,255,.9);margin-bottom:20px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;background:var(--court);color:var(--court-ink);font-weight:600;font-size:17px;white-space:nowrap;text-align:center}
.btn:active{filter:brightness(.92)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{display:flex;width:100%}
.btn.cork{background:var(--cork);color:var(--cork-ink)}
.btn.outline{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.outline-light{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6)}
.btn.danger{background:var(--neg-soft);color:var(--danger)}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.gap{margin-top:12px}
.link{padding:8px 10px;color:var(--court);font-weight:700;font-size:15px}

/* ledger rows */
.ledger{border:1.5px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;margin-top:12px}
.ledger>li+li{border-top:1px solid var(--line)}
.led-row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;background:transparent;color:inherit;min-height:64px}
button.led-row:active{background:var(--panel-2)}
.led-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.led-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:18px;line-height:1.2}
.led-sub{font-size:14px;color:var(--muted)}
.led-side{font-size:14px;color:var(--muted);white-space:nowrap}
.led-row .ic{color:var(--muted)}
.ev-ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--court-soft);color:var(--court);display:grid;place-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--cork);color:var(--cork-ink);font-size:12.5px;font-weight:700}
.led-row.exp{align-items:flex-start}
.exp-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.exp-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.exp-top .num{font-size:26px}
.exp-who{display:flex;align-items:center;gap:8px;font-size:15px}

/* avatars */
.h0{--h:12}.h1{--h:38}.h2{--h:92}.h3{--h:152}.h4{--h:188}.h5{--h:214}.h6{--h:268}.h7{--h:326}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1;background:hsl(var(--h,150) var(--av-s) var(--av-l));color:hsl(var(--h,150) var(--av-ink-s) var(--av-ink-l))}
.avatar.sm{width:28px;height:28px;font-size:16px}
.avatar.xs{width:22px;height:22px;font-size:14px}

/* forms */
.addbox{margin-top:8px}
.lbl{display:block;font-size:14.5px;font-weight:600;color:var(--muted);margin:18px 0 6px}
.lbl-row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:18px}
.lbl-row .lbl{margin:0 0 6px}
.input,.select,.textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px}
.textarea{resize:vertical;line-height:1.4}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.5}
.inline{display:flex;gap:10px}
.inline .input{flex:1;min-width:0}
.money{display:flex;align-items:center;gap:8px;padding:4px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel)}
.money:focus-within{outline:2.5px solid var(--court);outline-offset:2px}
.money .cur{font-family:var(--f-display);font-weight:700;font-size:30px;color:var(--muted)}
.money input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:40px;padding:4px 0;outline:none;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.tight{margin-top:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:8px -18px 0;padding:0 18px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px 0 7px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);font-weight:600;font-size:16px;color:var(--ink)}
.chip.on{background:var(--court);border-color:var(--court);color:var(--court-ink)}
.chip.text{padding:0 14px}
.chip.text.sm{min-height:34px;font-size:14.5px;padding:0 12px;background:var(--panel-2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:14px;background:var(--panel-2);border:1.5px solid var(--line);margin-top:16px}
.seg button{min-height:44px;padding:6px 8px;border-radius:10px;font-weight:600;line-height:1.15;color:var(--muted);display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere;text-align:center}
.seg button.on{background:var(--court);color:var(--court-ink)}

/* text blocks */
.sec{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:28px}
.prog{font-size:14px;color:var(--muted)}
.sub{font-family:var(--f-display);font-weight:700;font-size:21px;margin-top:18px}
.hint{font-size:14px;color:var(--muted);margin-top:10px}
.err{color:var(--danger);font-size:14.5px;font-weight:600;margin-top:8px}
.err:empty{display:none}
.note{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--court-soft);font-size:15px}
.note .ic{margin-top:2px;color:var(--court)}
.note.warn{background:var(--neg-soft)}
.note.warn .ic{color:var(--neg)}
.foot-note{margin-top:26px;font-size:13.5px;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:36px 4px 8px}
.empty-ic{width:52px;height:52px;border-radius:14px;background:var(--court-soft);color:var(--court);display:grid;place-items:center;margin-bottom:6px}
.empty h3{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05}
.empty p{color:var(--muted);max-width:34ch;margin-bottom:10px}

/* settle: the net band */
.net{margin-top:14px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.net-top{height:22px;border-top:5px solid var(--court);background-image:repeating-linear-gradient(45deg,transparent 0 6px,var(--line) 6px 7px),repeating-linear-gradient(-45deg,transparent 0 6px,var(--line) 6px 7px)}
.net-body{padding:12px 14px 14px}
.net-who{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
.net-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.net-stats .num{font-size:28px}
.net-note{font-size:14px;color:var(--muted);margin-top:10px}

/* settle: payments and balances */
.pay{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px;text-align:left;background:transparent;color:inherit}
.pay:active{background:var(--panel-2)}
.box{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.pay.done .box{background:var(--pos);border-color:var(--pos);color:var(--panel)}
.pay.done .pay-text{text-decoration:line-through;color:var(--muted)}
.pay.done .num{color:var(--muted)}
.pay-text{flex:1;min-width:0;font-size:17px}
.st{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.mini{display:flex;flex-wrap:wrap;column-gap:14px;row-gap:1px;font-size:13.5px;color:var(--muted)}
.mini b{color:var(--ink)}
.checks{margin-top:18px;padding:4px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel)}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 0;font-size:15px}
.ck+.ck{border-top:1px solid var(--line)}
.ck .ic{margin-top:2px}
.ck.ok .ic{color:var(--pos)}
.ck.bad .ic{color:var(--danger)}

/* tab bar and add button */
.tabbar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);padding:0 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1.5px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding-top:4px;color:var(--muted);font-size:13px;font-weight:600;box-shadow:inset 0 3px 0 transparent}
.tab.on{color:var(--court);box-shadow:inset 0 3px 0 var(--court)}
.fabwrap{position:fixed;left:0;right:0;margin:0 auto;max-width:520px;z-index:25;bottom:calc(78px + env(safe-area-inset-bottom,0px));padding:0 16px;display:flex;justify-content:flex-end;pointer-events:none}
.fab{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;min-height:54px;padding:0 20px;border-radius:16px;background:var(--cork);color:var(--cork-ink);font-weight:700;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* sheets */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,14,10,.55);animation:fade .18s ease-out}
.sheet{width:100%;max-width:520px;max-height:calc(100% - 12px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--panel);border-radius:22px 22px 0 0;animation:rise .22s cubic-bezier(.2,.8,.2,1)}
.grab{flex:none;width:38px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 18px 2px}
.sheet-head h2{font-family:var(--f-display);font-weight:700;font-size:28px}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:2px 18px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-foot{flex:none;display:grid;gap:10px;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--line);background:var(--panel)}
.foot-row{display:flex;gap:10px}
.foot-row>*{flex:1;min-width:0}
.foot-row .btn{padding:0 12px;white-space:normal;line-height:1.15}
.preview{padding:10px 12px;border-radius:12px;background:var(--panel-2);border:1.5px dashed var(--line);font-size:15.5px;line-height:1.35}
.pv-sub{margin-top:3px;font-size:14px;color:var(--muted)}
.confirm-text{font-size:17px;padding:4px 0 8px}
.sheet .seg{margin-top:0}
.srows{margin-top:10px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.srow{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:56px}
.srow+.srow{border-top:1px solid var(--line)}
.srow-name{flex:1;min-width:0;font-weight:600;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow-in{display:flex;align-items:center;gap:4px;padding:0 10px;height:44px;width:132px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel-2)}
.srow.s .srow-in{width:84px}
.srow-in:focus-within{outline:2.5px solid var(--court);outline-offset:1px}
.srow-in .pre{color:var(--muted);font-weight:600}
.srow-in input{width:100%;min-width:0;border:0;background:transparent;outline:none;font-family:var(--f-display);font-weight:700;font-size:22px;text-align:right;color:var(--ink);padding:0}
.srow-in input::placeholder{color:var(--muted);opacity:.75}
.calc{min-width:68px;text-align:right;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted)}
.pv-err{color:var(--danger);font-weight:600}
.bk-p{font-size:15.5px;margin-top:6px}
.bk-actions{display:grid;gap:10px;margin-top:12px}
.file-btn{position:relative;overflow:hidden;margin-top:12px;cursor:pointer}
.file-btn:focus-within{outline:2.5px solid var(--court);outline-offset:2px}
.file-over{position:absolute;top:0;left:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer;font-size:120px}
.rs-list{margin-top:10px;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.rs-item{display:flex;flex-direction:column;gap:1px;padding:10px 14px;font-size:16px}
.rs-item+.rs-item{border-top:1px solid var(--line)}
.rs-item .muted{font-size:14px}
.rs-warn{color:var(--neg);font-size:14px}
.ledger.spaced{margin-top:24px}
.mt0{margin-top:0}
.mt8{margin-top:8px}
.mt12{margin-top:12px}
.mt26{margin-top:26px}
.mt10{margin-top:10px}
.led-row:disabled{opacity:.5;cursor:not-allowed}
.img-wrap{margin-top:14px;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel-2);min-height:120px}
.img-prev{display:block;width:100%;height:auto}
.rem-row{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:64px}
.rem-row .led-main{flex:1;min-width:0}
.foot-note .link{padding:0 2px;font-size:inherit;font-weight:600;text-decoration:underline}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(28px)}to{transform:none}}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:22px;max-height:88%}}

/* toast */
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:14px;max-width:min(92%,460px);padding:12px 16px;border-radius:12px;background:var(--toast-bg);color:var(--toast-ink);font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast button{color:var(--toast-link);font-weight:700;font-size:15px;padding:4px 2px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<noscript><div class="wrap"><p class="hint">Evenly needs JavaScript to run.</p></div></noscript>
<div id="app"></div>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<script>
(function(){
'use strict';

/*<logic>*/
function splitEqual(amount,ids){
  const n=ids.length,base=Math.floor(amount/n);
  let rem=amount-base*n;
  const out={};
  for(const id of ids){out[id]=base+(rem>0?1:0);if(rem>0)rem--;}
  return out;
}

/* Per person: what they paid, their share, what they spent on others (own share excluded),
   what others spent on them, and the net (= spent on others - others spent on them). */
function compute(ev){
  const r={paid:{},share:{},onOthers:{},onMe:{},net:{},total:0};
  for(const m of ev.members){r.paid[m.id]=0;r.share[m.id]=0;r.onOthers[m.id]=0;r.onMe[m.id]=0;}
  for(const e of ev.expenses){
    if(!(e.payer in r.paid))continue;
    const ids=Array.from(new Set(e.forIds)).filter(id=>id in r.paid);
    if(!ids.length)continue;
    const sh=expenseShares(e,ids);
    let own=0;
    r.total+=e.amount;
    r.paid[e.payer]+=e.amount;
    for(const id of ids){
      r.share[id]+=sh[id];
      if(id===e.payer)own=sh[id];else r.onMe[id]+=sh[id];
    }
    r.onOthers[e.payer]+=e.amount-own;
  }
  for(const m of ev.members)r.net[m.id]=r.onOthers[m.id]-r.onMe[m.id];
  return r;
}

/* Everyone settles with the coordinator: debtors pay in, creditors are paid out. */
function planHub(ev,calc){
  const collect=[],payout=[],hub=ev.coordId;
  for(const m of ev.members){
    if(m.id===hub)continue;
    const n=calc.net[m.id];
    if(n<0)collect.push({from:m.id,to:hub,amt:-n});
    else if(n>0)payout.push({from:hub,to:m.id,amt:n});
  }
  return {collect,payout};
}

/* Fewest payments between members. Exact for up to 15 people with a non-zero balance:
   split them into the largest possible number of groups that already balance each other,
   then settle each group. */
function planDirect(ev,calc){
  const people=ev.members.filter(m=>calc.net[m.id]!==0).map(m=>m.id);
  const m=people.length,out=[];
  if(!m)return out;
  const vals=people.map(id=>calc.net[id]);
  const settle=idxs=>{
    const D=[],C=[];
    for(const i of idxs){
      if(vals[i]<0)D.push({id:people[i],amt:-vals[i]});
      else if(vals[i]>0)C.push({id:people[i],amt:vals[i]});
    }
    D.sort((a,b)=>b.amt-a.amt);C.sort((a,b)=>b.amt-a.amt);
    let i=0,j=0;
    while(i<D.length&&j<C.length){
      const t=Math.min(D[i].amt,C[j].amt);
      out.push({from:D[i].id,to:C[j].id,amt:t});
      D[i].amt-=t;C[j].amt-=t;
      if(D[i].amt===0)i++;
      if(C[j].amt===0)j++;
    }
  };
  if(m>15){settle(people.map((_,i)=>i));return out;}
  const size=1<<m,sum=new Float64Array(size),dp=new Int8Array(size),par=new Int8Array(size);
  for(let mask=1;mask<size;mask++){
    const low=mask&-mask,li=31-Math.clz32(low);
    sum[mask]=sum[mask^low]+vals[li];
    let best=-1,bi=0;
    for(let j=0;j<m;j++){
      if(mask&(1<<j)){const v=dp[mask^(1<<j)];if(v>best){best=v;bi=j;}}
    }
    dp[mask]=best+(sum[mask]===0?1:0);
    par[mask]=bi;
  }
  const seq=[];
  let mk=size-1;
  while(mk){const j=par[mk];seq.push(j);mk^=(1<<j);}
  seq.reverse();
  let cur=[],run=0;
  for(const i of seq){
    cur.push(i);run+=vals[i];
    if(run===0){settle(cur);cur=[];}
  }
  if(cur.length)settle(cur);
  return out;
}

/* Safety net: checks the plan against the numbers. */
function verify(ev,calc,transfers,hubId){
  const inn={},out={};
  for(const m of ev.members){inn[m.id]=0;out[m.id]=0;}
  for(const t of transfers){out[t.from]+=t.amt;inn[t.to]+=t.amt;}
  let balanced=true,capped=true;
  for(const m of ev.members){
    const netIn=inn[m.id]-out[m.id];
    if(netIn!==calc.net[m.id])balanced=false;
    if(netIn>calc.onOthers[m.id])capped=false;
    if(m.id!==hubId&&inn[m.id]>calc.onOthers[m.id])capped=false;
  }
  return {balanced,capped};
}

/* "1,400" -> 140000, "12,5" -> 1250, "₹99.99" -> 9999. Returns minor units (paise/cents) or NaN. */
function parseAmount(str){
  let s=String(str==null?'':str).replace(/[^\d.,]/g,'');
  if(!s)return NaN;
  const commas=(s.match(/,/g)||[]).length;
  if(s.indexOf('.')<0&&commas===1&&/,\d{1,2}$/.test(s))s=s.replace(',','.');
  else s=s.replace(/,/g,'');
  if(!/^\d*\.?\d*$/.test(s)||!/\d/.test(s))return NaN;
  const parts=s.split('.'),w=parts[0]||'0',f=parts[1]||'';
  let minor=parseInt(w,10)*100+parseInt((f+'00').slice(0,2),10);
  if(f.length>2&&f.charAt(2)>='5')minor+=1;
  return isFinite(minor)?minor:NaN;
}

/* ---- unequal splits ---- */
/* Split an amount (minor units) in proportion to weights. Leftover paise go to the largest remainders. */
function splitByWeights(amount,ids,weights){
  const W=weights.map(w=>Math.round(w*100)),tot=W.reduce((a,b)=>a+b,0);
  const q=[],r=[];
  let used=0;
  for(let i=0;i<ids.length;i++){
    const num=amount*W[i];
    let qi=Math.floor(num/tot),ri=num-qi*tot;
    while(ri<0){qi--;ri+=tot;}
    while(ri>=tot){qi++;ri-=tot;}
    q.push(qi);r.push(ri);used+=qi;
  }
  const left=amount-used;
  const order=ids.map((_,i)=>i).sort((a,b)=>r[b]-r[a]||a-b);
  for(let k=0;k<left;k++)q[order[k]]++;
  const out={};
  ids.forEach((id,i)=>{out[id]=q[i];});
  return out;
}

/* "By amount": people with a typed amount are fixed; everyone else shares what is left equally. */
function resolveAmounts(amount,ids,fixed){
  const out={},auto=[];
  let sumFixed=0,nFixed=0;
  for(const id of ids){
    const v=fixed[id];
    if(v==null)auto.push(id);
    else{out[id]=v;sumFixed+=v;nFixed++;}
  }
  const rest=amount-sumFixed;
  if(auto.length){
    if(rest<0)return {ok:false,over:-rest,nFixed};
    const sh=splitEqual(rest,auto);
    for(const id of auto)out[id]=sh[id];
    return {ok:true,shares:out,rest,auto,nFixed};
  }
  if(rest<0)return {ok:false,over:-rest,nFixed};
  if(rest>0)return {ok:false,left:rest,nFixed};
  return {ok:true,shares:out,rest:0,auto:[],nFixed};
}

/* The per-person shares of one expense: the stored uneven shares when they are valid, otherwise equal. */
function expenseShares(e,ids){
  if(e.sh&&typeof e.sh==='object'){
    let s=0,ok=Object.keys(e.sh).length===ids.length;
    for(const id of ids){const v=e.sh[id];if(!Number.isInteger(v)||v<0){ok=false;break;}s+=v;}
    if(ok&&s===e.amount)return e.sh;
  }
  return splitEqual(e.amount,ids);
}

const parseWeight=raw=>{const m=parseAmount(raw);return Number.isNaN(m)?NaN:m/100;};

/* Turns the add/edit form into per-person shares, or says what is wrong. */
function resolveDraft(ev,d){
  const amt=parseAmount(d.amountStr);
  const ids=ev.members.filter(m=>d.forIds.indexOf(m.id)>=0).map(m=>m.id);
  const nameOf=id=>{const m=ev.members.find(x=>x.id===id);return m?m.name:'?';};
  const base={amt,ids,mode:d.mode||'equal'};
  if(!(amt>0)||!ids.length)return Object.assign(base,{ok:false,idle:true});
  if(base.mode==='shares'){
    const w=[];
    for(const id of ids){
      const raw=String((d.valsS||{})[id]||'').trim();
      const v=raw===''?1:parseWeight(raw);
      if(!(v>0&&v<=100))return Object.assign(base,{ok:false,err:'Shares for '+nameOf(id)+' must be between 0.01 and 100.'});
      w.push(v);
    }
    return Object.assign(base,{ok:true,weights:w,shares:splitByWeights(amt,ids,w)});
  }
  if(base.mode==='amount'){
    const fixed={};
    for(const id of ids){
      const raw=String((d.valsA||{})[id]||'').trim();
      if(raw===''){fixed[id]=null;continue;}
      const v=parseAmount(raw);
      if(!(v>=0))return Object.assign(base,{ok:false,err:'Check the amount for '+nameOf(id)+'.'});
      fixed[id]=v;
    }
    return Object.assign(base,{fixed},resolveAmounts(amt,ids,fixed));
  }
  return Object.assign(base,{ok:true,shares:splitEqual(amt,ids)});
}

/* ---- data helpers ---- */
const HUES=8;
let _c=0;
const uid=()=>Date.now().toString(36)+(_c++).toString(36)+Math.random().toString(36).slice(2,5);

const CURRENCIES=['₹','$','€','£','AED','SAR','QAR','OMR','KWD','BHD','MYR','S$',''];
const isId=x=>typeof x==='string'&&/^[A-Za-z0-9][A-Za-z0-9_-]{0,39}$/.test(x);
const DONE_KEY=/^[hd]_[A-Za-z0-9][A-Za-z0-9_-]*_[A-Za-z0-9][A-Za-z0-9_-]*_\d{1,12}$/;

/* Cleans one event coming from storage or from a file. Anything unexpected is dropped or replaced,
   because files can come from other people. */
function normEvent(e){
  if(!e||typeof e!=='object')return null;
  const seen=new Set();
  const members=(Array.isArray(e.members)?e.members:[]).slice(0,100)
    .filter(m=>m&&isId(m.id)&&typeof m.name==='string'&&m.name.trim()!==''&&!seen.has(m.id)&&seen.add(m.id))
    .map((m,i)=>({id:m.id,name:m.name.slice(0,24),h:Number.isInteger(m.h)?((m.h%HUES)+HUES)%HUES:i%HUES}));
  if(!members.length)return null;
  const ids=new Set(members.map(m=>m.id));
  const expenses=(Array.isArray(e.expenses)?e.expenses:[]).slice(0,5000)
    .filter(x=>x&&ids.has(x.payer)&&Number.isFinite(x.amount)&&x.amount>0&&x.amount<=1e11&&Array.isArray(x.forIds))
    .map(x=>{
      const rec={id:isId(x.id)?x.id:uid(),title:String(x.title||'Expense').slice(0,40),amount:Math.round(x.amount),payer:x.payer,forIds:Array.from(new Set(x.forIds.slice(0,200).filter(i=>ids.has(i)))),at:Number(x.at)||Date.now()};
      if((x.mode==='shares'||x.mode==='amount')&&x.sh&&typeof x.sh==='object'&&rec.forIds.length){
        let s=0,ok=Object.keys(x.sh).length===rec.forIds.length;
        for(const id of rec.forIds){const v=x.sh[id];if(!Number.isInteger(v)||v<0){ok=false;break;}s+=v;}
        if(ok&&s===rec.amount){
          rec.mode=x.mode;rec.sh={};rec.vals={};
          rec.forIds.forEach(id=>{rec.sh[id]=x.sh[id];const t=x.vals&&x.vals[id];if(typeof t==='string'&&t.length<=12)rec.vals[id]=t;});
        }
      }
      return rec;
    })
    .filter(x=>x.forIds.length);
  const done={};
  if(e.done&&typeof e.done==='object'){
    let n=0;
    for(const k of Object.keys(e.done)){if(n>=3000)break;if(DONE_KEY.test(k)&&e.done[k]){done[k]=1;n++;}}
  }
  return {id:isId(e.id)?e.id:uid(),name:String(e.name||'Event').slice(0,40),currency:CURRENCIES.indexOf(e.currency)>=0?e.currency:'₹',createdAt:Number(e.createdAt)||Date.now(),coordId:ids.has(e.coordId)?e.coordId:members[0].id,members,expenses,mode:e.mode==='direct'?'direct':'hub',done};
}

/* kind: 'backup' for everything on the device, 'event' for one event shared with a group. */
function makeBackup(state,kind){
  const o={app:'evenly',version:1,kind:kind||'backup',savedAt:new Date().toISOString(),events:state.events};
  if(state.lastCoord!=null)o.lastCoord=state.lastCoord;
  if(state.lastCur!=null)o.lastCur=state.lastCur;
  return JSON.stringify(o);
}
function parseBackup(text){
  const raw=String(text==null?'':text).trim();
  if(!raw)return {err:'Choose a file or paste the text first.'};
  const a=raw.indexOf('{'),b=raw.lastIndexOf('}');
  if(a<0||b<a)return {err:'That does not look like an Evenly file.'};
  let d;
  try{d=JSON.parse(raw.slice(a,b+1));}catch(e){return {err:'The text is incomplete or damaged. Copy it again in full and retry.'};}
  if(!d||d.app!=='evenly'||!Array.isArray(d.events))return {err:'That does not look like an Evenly file.'};
  const seen=new Set(),events=[];
  for(const x of d.events.slice(0,200)){const n=normEvent(x);if(n&&!seen.has(n.id)){seen.add(n.id);events.push(n);}}
  if(!events.length)return {err:'This file has no events in it.'};
  return {events,kind:d.kind==='event'?'event':'backup',savedAt:typeof d.savedAt==='string'?d.savedAt:null,lastCoord:typeof d.lastCoord==='string'?d.lastCoord.slice(0,24):null,lastCur:CURRENCIES.indexOf(d.lastCur)>=0?d.lastCur:null};
}

/* What makes two copies of an event "the same": people and expenses, not ticks or view mode. */
const contentKey=e=>JSON.stringify([e.name,e.currency,e.coordId,e.members.map(m=>[m.id,m.name]),e.expenses.map(x=>[x.id,x.title,x.amount,x.payer,x.forIds,x.sh||null])]);

/* Adds events from a file. Events you do not have are added. For ones you already have, how='update'
   replaces your copy (keeping your ticked payments) and anything else adds the file's version as a copy. */
function mergeImport(local,incoming,how,newId,now){
  const events=local.slice(),res={events,added:0,updated:0,copied:0,last:null};
  for(const e of incoming){
    const i=events.findIndex(x=>x.id===e.id);
    if(i<0){const n=Object.assign({},e,{createdAt:now});events.push(n);res.added++;res.last=n;}
    else if(how==='update'){
      const l=events[i],n=Object.assign({},e,{createdAt:l.createdAt,done:Object.assign({},e.done,l.done)});
      events[i]=n;res.updated++;res.last=n;
    }else{
      const n=Object.assign({},e,{id:newId(),name:e.name.slice(0,33)+' (copy)',createdAt:now});
      events.push(n);res.copied++;res.last=n;
    }
  }
  return res;
}

/* ---- settlement plan for one event ---- */
const tkey=(hubOn,t)=>(hubOn?'h':'d')+'_'+t.from+'_'+t.to+'_'+t.amt;
function getPlan(ev,calc){
  const hubOn=ev.mode!=='direct';
  if(hubOn){
    const p=planHub(ev,calc);
    return {hubOn,collect:p.collect,payout:p.payout,transfers:p.collect.concat(p.payout)};
  }
  const ord=id=>ev.members.findIndex(m=>m.id===id);
  const t=planDirect(ev,calc).sort((a,b)=>ord(a.from)-ord(b.from)||b.amt-a.amt);
  return {hubOn,collect:[],payout:[],transfers:t};
}
/* Payments someone still has to make: in coordinator mode only what people owe the coordinator. */
function unpaidList(ev,P){return (P.hubOn?P.collect:P.transfers).filter(t=>!ev.done[tkey(P.hubOn,t)]);}

/* ---- repeat an event ---- */
function nextEventName(name,dateLabel){
  const base=String(name).replace(/\s*\((?:\d{1,2}\s+[A-Za-z]{3,}|[A-Za-z]{3,}\s+\d{1,2})\)$/,'').trim()||'Event';
  const suffix=' ('+dateLabel+')';
  return base.slice(0,Math.max(1,40-suffix.length))+suffix;
}
/* Same people, coordinator and settings; optionally the same expenses. Ticked payments never carry over. */
function cloneEvent(ev,name,withExpenses,newId,now){
  const map={};
  const members=ev.members.map(m=>{const id=newId();map[m.id]=id;return {id,name:m.name,h:m.h};});
  const out={id:newId(),name:String(name).slice(0,40),currency:ev.currency,createdAt:now,coordId:map[ev.coordId]||members[0].id,members,expenses:[],mode:ev.mode,done:{}};
  if(withExpenses){
    out.expenses=ev.expenses.map(x=>{
      const rec={id:newId(),title:x.title,amount:x.amount,payer:map[x.payer],forIds:x.forIds.map(i=>map[i]),at:now};
      if(x.mode&&x.sh){
        rec.mode=x.mode;rec.sh={};rec.vals={};
        Object.keys(x.sh).forEach(k=>{rec.sh[map[k]]=x.sh[k];});
        Object.keys(x.vals||{}).forEach(k=>{rec.vals[map[k]]=x.vals[k];});
      }
      return rec;
    });
  }
  return out;
}

/* ---- WhatsApp reminder texts (items: {from,to,fromName,toName,amt}) ---- */
const listJoin=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
function reminderGroup(eventName,coordName,hubOn,items,money){
  const L=[eventName+': reminder',hubOn?'Please pay '+coordName+':':'Payments still to make:'];
  items.forEach(t=>L.push(hubOn?'\u2022 '+t.fromName+': '+money(t.amt):'\u2022 '+t.fromName+' pays '+t.toName+': '+money(t.amt)));
  L.push('Thank you!');
  return L.join('\n');
}
function reminderPerson(eventName,name,items,money){
  return 'Hi '+name+', a quick reminder for '+eventName+': please pay '+listJoin(items.map(t=>t.toName+' '+money(t.amt)))+'. Thank you!';
}
function payersOf(ev,items){
  const map={};
  items.forEach(t=>{const e=map[t.from]||(map[t.from]={id:t.from,name:t.fromName,items:[],total:0});e.items.push(t);e.total+=t.amt;});
  return ev.members.map(m=>map[m.id]).filter(Boolean);
}

/* ---- what the shared image shows ---- */
function resultModel(ev,calc,P,withBalances,money,dateLabel){
  const nm=id=>{const m=ev.members.find(x=>x.id===id);return m?m.name:'?';};
  const row=(t,name)=>({name,amount:money(t.amt),done:!!ev.done[tkey(P.hubOn,t)]});
  const coord=nm(ev.coordId),sections=[];
  if(!P.transfers.length)sections.push({title:'All square',rows:[{name:'Nobody owes anyone',amount:'',done:false,plain:true}]});
  else if(P.hubOn){
    if(P.collect.length)sections.push({title:'Pay '+coord,rows:P.collect.map(t=>row(t,nm(t.from)))});
    if(P.payout.length)sections.push({title:coord+' pays',rows:P.payout.map(t=>row(t,nm(t.to)))});
  }else sections.push({title:'Payments',rows:P.transfers.map(t=>row(t,nm(t.from)+' pays '+nm(t.to)))});
  const balances=withBalances?ev.members.map(m=>{
    const n=calc.net[m.id];
    return {name:m.name,text:n===0?'Even':(n>0?'gets ':'owes ')+money(Math.abs(n)),sign:n>0?1:n<0?-1:0};
  }):null;
  return {title:ev.name,total:money(calc.total),date:dateLabel,sections,balances};
}

  image:'<rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>',
  bell:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  alert:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'
};
const icon=(n,s)=>`<svg class="ic" width="${s||20}" height="${s||20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;
const COURT='<svg class="court" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="10" y="10" width="380" height="240"/><line x1="10" y1="28" x2="390" y2="28"/><line x1="10" y1="232" x2="390" y2="232"/><line x1="200" y1="10" x2="200" y2="250" stroke-width="4"/><line x1="144" y1="10" x2="144" y2="250"/><line x1="256" y1="10" x2="256" y2="250"/><line x1="32" y1="10" x2="32" y2="250"/><line x1="368" y1="10" x2="368" y2="250"/><line x1="10" y1="130" x2="144" y2="130"/><line x1="256" y1="130" x2="390" y2="130"/></svg>';
const MARK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><line x1="12" y1="5" x2="12" y2="19"/><line x1="3" y1="12" x2="8.5" y2="12"/><line x1="15.5" y1="12" x2="21" y2="12"/></svg>';

/* ---------- state and storage ---------- */
const KEY='evenly.v1';
let S={v:1,events:[],currentId:null,tab:'expenses',lastCoord:'Jinan',lastCur:'₹',lastBackup:0};
let storageOk=true;
const ui={sheet:null,confirmFn:null,toastAction:null,pendingRestore:null};

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const d=JSON.parse(raw);
      if(d&&Array.isArray(d.events)){
        S=Object.assign(S,d);
        S.events=S.events.map(normEvent).filter(Boolean);
      }
    }
  }catch(e){}
  try{localStorage.setItem('__evenly_t','1');localStorage.removeItem('__evenly_t');}catch(e){storageOk=false;}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOk=false;}}

const curEv=()=>S.events.find(e=>e.id===S.currentId)||null;
const mem=(ev,id)=>ev.members.find(m=>m.id===id);
const nm=(ev,id)=>{const m=mem(ev,id);return m?m.name:'?';};

function fmt(minor,cur){
  const a=Math.abs(minor),frac=a%100;
  const num=(a/100).toLocaleString(undefined,{minimumFractionDigits:frac?2:0,maximumFractionDigits:2});
  const c=cur==null?'':cur;
  const body=c.length>1?c+'\u00A0'+num:c+num;
  return (minor<0?'\u2212':'')+body;
}
const M=(ev,minor)=>fmt(minor,ev.currency);
const initial=n=>{const t=Array.from(String(n).trim())[0]||'?';return t.toUpperCase();};
const avatar=(m,cls)=>`<span class="avatar h${m?m.h:0} ${cls||''}" aria-hidden="true">${esc(initial(m?m.name:'?'))}</span>`;
const ledger=rows=>`<ul class="ledger">${rows.map(r=>`<li>${r}</li>`).join('')}</ul>`;
const emptyBlock=(ic,title,text,action)=>`<div class="empty"><div class="empty-ic">${icon(ic,26)}</div><h3>${title}</h3><p>${text}</p>${action||''}</div>`;
const plural=(n,w)=>n+' '+w+(n===1?'':'s');

function eachLabel(ev,amount,ids){
  const vals=Object.values(splitEqual(amount,ids)),lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  return lo===hi?M(ev,lo):M(ev,lo)+' to '+M(ev,hi);
}
function forLabel(ev,e){
  if(e.forIds.length===ev.members.length)return 'everyone ('+e.forIds.length+')';
  return e.forIds.map(id=>nm(ev,id)).join(', ');
}
const isUneven=e=>e.mode==='shares'||e.mode==='amount';
function shareLabel(ev,e){return e.forIds.map(id=>nm(ev,id)+' '+M(ev,e.sh[id])).join(', ');}

/* ---------- views ---------- */
function homeView(){
  const evs=S.events.slice().sort((a,b)=>b.createdAt-a.createdAt);
  const rows=evs.map(e=>{
    const c=compute(e);
    return `<button class="led-row" data-act="openEvent" data-id="${e.id}">
      <span class="ev-ic">${icon('receipt',20)}</span>
      <span class="led-main"><span class="led-title">${esc(e.name)}</span>
      <span class="led-sub">${plural(e.members.length,'person').replace('persons','people')}, ${plural(e.expenses.length,'expense')}, ${fmt(c.total,e.currency)} spent</span></span>
      ${icon('chev',18)}</button>`;
  });
  const banner=storageOk?'':`<div class="note warn">${icon('alert',18)}<span>This browser is not letting the page save data, so events will be lost when you close it.</span></div>`;
  const backupRow=`<ul class="ledger spaced"><li><button class="led-row" data-act="importEvent"><span class="ev-ic">${icon('upload',20)}</span><span class="led-main"><span class="led-title">Add event from file</span><span class="led-sub">Got an event from someone in your group? Add it here</span></span>${icon('chev',18)}</button></li><li><button class="led-row" data-act="backup"><span class="ev-ic">${icon('database',20)}</span><span class="led-main"><span class="led-title">Backup and restore</span><span class="led-sub">Keep a copy of your events, or bring them back</span></span>${icon('chev',18)}</button></li></ul>`;
  const last=S.lastBackup?'Last backup: '+dateText(S.lastBackup)+'.':'No backup yet.';
  return `<div class="wrap screen">${banner}
    <section class="hero">${COURT}<div class="hero-in">
      <div class="brand"><span class="mark">${MARK}</span><span>Evenly</span></div>
      <h1>Split it fairly.</h1>
      <p>Log who paid and who it was for. Evenly works out who owes whom, and never pays anyone back more than they spent on others.</p>
      <div class="hero-actions"><button class="btn cork" data-act="newEvent">${icon('plus',20)}New event</button>${evs.length?'':'<button class="btn outline-light" data-act="sample">Try a sample</button>'}</div>
    </div></section>
    ${evs.length?`<div class="sec-row"><h2 class="sec">Your events</h2></div>${ledger(rows)}`:''}
    ${backupRow}
    <p class="foot-note">Events are saved on this device only. ${last} <button class="link" data-act="privacy">Privacy</button></p>
  </div>`;
}

function tabbar(){
  const t=(id,label,ic)=>`<button class="tab ${S.tab===id?'on':''}" data-act="tab" data-tab="${id}" aria-current="${S.tab===id?'page':'false'}">${icon(ic,22)}<span>${label}</span></button>`;
  return `<nav class="tabbar" aria-label="Sections">${t('people','People','users')}${t('expenses','Expenses','receipt')}${t('settle','Settle up','repeat')}</nav>`;
}

function eventView(ev){
  const calc=compute(ev);
  if(['people','expenses','settle'].indexOf(S.tab)<0)S.tab='expenses';
  const body=S.tab==='people'?peopleView(ev,calc):S.tab==='expenses'?expensesView(ev,calc):settleView(ev,calc);
  const fab=(S.tab==='expenses'&&ev.members.length>=2)?`<div class="fabwrap"><button class="fab" data-act="addExpense">${icon('plus',22)}Add expense</button></div>`:'';
  return `<div class="wrap screen">
    <header class="topbar">
      <button class="iconbtn" data-act="home" aria-label="All events">${icon('back',22)}</button>
      <div class="tb-title"><h1 class="tb-name">${esc(ev.name)}</h1><p class="tb-sub">${plural(ev.members.length,'person').replace('persons','people')}, ${plural(ev.expenses.length,'expense')}</p></div>
      <button class="iconbtn" data-act="eventSettings" aria-label="Event settings">${icon('more',22)}</button>
    </header>
    ${body}
  </div>${fab}${tabbar()}`;
}

function peopleView(ev,calc){
  const rows=ev.members.map(m=>`<button class="led-row" data-act="editMember" data-id="${m.id}">${avatar(m)}<span class="led-main"><span class="led-title">${esc(m.name)}${m.id===ev.coordId?`<span class="tag">${icon('crown',12)}Coordinator</span>`:''}</span></span><span class="led-side">${calc.paid[m.id]?'Paid '+M(ev,calc.paid[m.id]):''}</span>${icon('chev',18)}</button>`);
  return `<section class="addbox">
    <label class="lbl" for="newMember">Add people</label>
    <div class="inline"><input id="newMember" class="input" placeholder="A name, or several with commas" maxlength="160" autocomplete="off" enterkeyhint="done" data-enter="#addMembers"><button class="btn" id="addMembers" data-act="addMembers">Add</button></div>
    <p class="err" id="memberErr" role="alert"></p>
  </section>
  ${ledger(rows)}
  <p class="hint">Tap a person to rename them, make them the coordinator, or remove them.</p>`;
}

function expenseRow(ev,e){
  const n=e.forIds.length;
  const line=isUneven(e)
    ?`Split ${e.mode==='shares'?'by shares':'by amount'}: ${esc(shareLabel(ev,e))}`
    :`Split ${n} way${n===1?'':'s'}, ${eachLabel(ev,e.amount,e.forIds)}${n>1?' each':''}: ${esc(forLabel(ev,e))}`;
  return `<button class="led-row exp" data-act="editExpense" data-id="${e.id}"><span class="exp-body">
    <span class="exp-top"><span class="led-title">${esc(e.title)}</span><span class="num">${M(ev,e.amount)}</span></span>
    <span class="exp-who">${avatar(mem(ev,e.payer),'xs')}<span>${esc(nm(ev,e.payer))} paid</span></span>
    <span class="led-sub">${line}</span>
  </span></button>`;
}

function expensesView(ev,calc){
  if(ev.members.length<2)return emptyBlock('users','Add your group first','Add the people who are sharing costs, then log what each of them paid.',`<button class="btn" data-act="tab" data-tab="people">Add people</button>`);
  if(!ev.expenses.length)return emptyBlock('receipt','No expenses yet','Each time someone reports what they paid, tap Add expense and note who paid, how much, and who it was for.','');
  const rows=ev.expenses.slice().reverse().map(e=>expenseRow(ev,e));
  return `<div class="sec-row mt8"><h2 class="sec">${M(ev,calc.total)} spent</h2></div>
    ${ledger(rows)}
    <p class="hint">Tap an expense to edit or delete it.</p>`;
}

function settleView(ev,calc){
  if(!ev.expenses.length)return emptyBlock('repeat','Nothing to settle yet','Add the first expense: who paid, how much, and who it was for.',`<button class="btn" data-act="tab" data-tab="expenses">Go to expenses</button>`);
  const P=getPlan(ev,calc),hubOn=P.hubOn,hub=ev.coordId,c=esc(nm(ev,hub));
  const total=P.transfers.length,doneN=P.transfers.filter(t=>ev.done[tkey(hubOn,t)]).length;
  const chk=verify(ev,calc,P.transfers,hubOn?hub:null);
  const seg=`<div class="seg" role="group" aria-label="How to settle"><button class="${hubOn?'on':''}" data-act="mode" data-mode="hub" aria-pressed="${hubOn}">Via ${c}</button><button class="${hubOn?'':'on'}" data-act="mode" data-mode="direct" aria-pressed="${!hubOn}">Direct</button></div>`;
  const desc=hubOn
    ?`Everyone who owes pays ${c}, then ${c} pays everyone who is owed. What ${c} spent on others, and what others spent on ${c}, is already counted.`
    :`Members pay each other directly, using the fewest payments. Each person only pays or only receives.`;
  const payRow=t=>{
    const k=tkey(hubOn,t),d=!!ev.done[k],who=(hubOn&&t.from===hub)?t.to:t.from;
    return `<button class="pay ${d?'done':''}" data-act="toggleDone" data-key="${k}" aria-pressed="${d}"><span class="box">${icon('check',16)}</span>${avatar(mem(ev,who),'sm')}<span class="pay-text"><b>${esc(nm(ev,t.from))}</b> pays <b>${esc(nm(ev,t.to))}</b></span><span class="num">${M(ev,t.amt)}</span></button>`;
  };
  let pay='';
  if(!total){
    pay=`<div class="note">${icon('check',18)}<span>All square. Nobody owes anyone.</span></div>`;
  }else if(hubOn){
    const D=P.collect.reduce((s,t)=>s+t.amt,0),C=P.payout.reduce((s,t)=>s+t.amt,0),hn=calc.net[hub];
    let own;
    if(hn>0)own=`${c} keeps ${M(ev,hn)}: ${M(ev,calc.onOthers[hub])} spent on others, minus ${M(ev,calc.onMe[hub])} others spent on ${c}.`;
    else if(hn<0)own=`${c} puts in ${M(ev,-hn)}: ${M(ev,calc.onMe[hub])} others spent on ${c}, minus ${M(ev,calc.onOthers[hub])} spent on others.`;
    else own=`${c} ends up even: what comes in equals what goes out.`;
    const net=`<div class="net" role="group" aria-label="${c} in the middle"><div class="net-top" aria-hidden="true"></div><div class="net-body">
      <div class="net-who">${avatar(mem(ev,hub))}<span>${c} collects, then pays out</span></div>
      <div class="net-stats">
        <div><span class="k">Collects</span><span class="num">${M(ev,D)}</span></div>
        <div><span class="k">Pays out</span><span class="num">${M(ev,C)}</span></div>
        <div><span class="k">${hn<0?'Puts in':'Keeps'}</span><span class="num ${hn<0?'neg':'pos'}">${M(ev,Math.abs(hn))}</span></div>
      </div>
      <p class="net-note">${own}</p></div></div>`;
    if(P.collect.length)pay+=`<h3 class="sub">Pay ${c}</h3>${ledger(P.collect.map(payRow))}`;
    pay+=net;
    if(P.payout.length)pay+=`<h3 class="sub">${c} pays</h3>${ledger(P.payout.map(payRow))}`;
    pay+=`<p class="hint">Collect first, then pay out. Tap a payment to tick it off once it is done.</p>`;
  }else{
    pay=ledger(P.transfers.map(payRow))+`<p class="hint">Tap a payment to tick it off once it is done.</p>`;
  }
  const bal=ev.members.map(m=>{
    const n=calc.net[m.id];
    const st=n>0?`<span class="st pos"><span class="k">gets</span><span class="num">${M(ev,n)}</span></span>`
      :n<0?`<span class="st neg"><span class="k">owes</span><span class="num">${M(ev,-n)}</span></span>`
      :`<span class="st"><span class="k">even</span></span>`;
    return `<div class="led-row">${avatar(m)}<span class="led-main"><span class="led-title">${esc(m.name)}${m.id===hub?`<span class="tag">${icon('crown',12)}Coordinator</span>`:''}</span><span class="mini"><span>Spent on others <b>${M(ev,calc.onOthers[m.id])}</b></span><span>Others spent on them <b>${M(ev,calc.onMe[m.id])}</b></span></span></span>${st}</div>`;
  });
  const ck=(ok,good,bad)=>`<div class="ck ${ok?'ok':'bad'}">${icon(ok?'check':'alert',18)}<span>${ok?good:bad}</span></div>`;
  return `${seg}<p class="hint">${desc}</p>
    <div class="sec-row"><h2 class="sec">Who pays whom</h2><span class="prog">${total?`${doneN} of ${total} done`:''}</span></div>
    ${pay}
    <div class="checks">${ck(chk.balanced,'Every person ends up exactly even.','The payments do not add up. Check the expenses.')}${ck(chk.capped,'Nobody gets back more than they spent on others.','Someone would get back more than they spent on others. Check the expenses.')}</div>
    <div class="sec-row"><h2 class="sec">Balances</h2><span class="prog">${M(ev,calc.total)} spent</span></div>
    ${ledger(bal)}
    <button class="btn outline block gap mt26" data-act="hub">${icon('share',18)}Share and remind</button>
    <button class="btn outline block gap" data-act="repeatEvent">${icon('repeat',18)}Repeat this event</button>`;
}

/* ---------- summary text ---------- */
function summaryText(ev){
  const calc=compute(ev),P=getPlan(ev,calc),c=nm(ev,ev.coordId),L=[];
  L.push(ev.name+': settle up');
  L.push('Total spent: '+M(ev,calc.total)+' on '+plural(ev.expenses.length,'expense'));
  L.push('');
  if(!P.transfers.length){L.push('All square. Nobody owes anyone.');L.push('');}
  else if(P.hubOn){
    if(P.collect.length){L.push('Pay '+c+':');P.collect.forEach(t=>L.push('- '+nm(ev,t.from)+': '+M(ev,t.amt)));L.push('');}
    if(P.payout.length){L.push(c+' pays:');P.payout.forEach(t=>L.push('- '+nm(ev,t.to)+': '+M(ev,t.amt)));L.push('');}
  }else{
    L.push('Payments:');
    P.transfers.forEach(t=>L.push('- '+nm(ev,t.from)+' pays '+nm(ev,t.to)+': '+M(ev,t.amt)));
    L.push('');
  }
  L.push('Expenses:');
  ev.expenses.forEach(e=>L.push('- '+e.title+', '+M(ev,e.amount)+', paid by '+nm(ev,e.payer)+', '+(isUneven(e)?'split by '+(e.mode==='shares'?'shares':'amount')+': '+shareLabel(ev,e):'for '+forLabel(ev,e))));
  return L.join('\n');
}

/* ---------- sheets ---------- */
const shell=(title,body,foot)=>`<div class="overlay" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sheet-head"><h2>${esc(title)}</h2><button class="iconbtn sm" data-act="closeSheet" aria-label="Close">${icon('x',20)}</button></div><div class="sheet-body">${body}</div>${foot?`<div class="sheet-foot">${foot}</div>`:''}</div></div>`;
const curOptions=(sel)=>{
  const list=CURS.some(x=>x[0]===sel)?CURS:[[sel,sel]].concat(CURS);
  return list.map(x=>`<option value="${esc(x[0])}" ${x[0]===sel?'selected':''}>${esc(x[1])}</option>`).join('');
};

function newEventSheet(){
  const reuse=S.events.length?`<label class="lbl" for="neReuse">Reuse people from</label><select id="neReuse" class="select" data-field="reuse"><option value="">Start fresh</option>${S.events.map(e=>`<option value="${e.id}">${esc(e.name)} (${e.members.length})</option>`).join('')}</select>`:'';
  const body=`<label class="lbl" for="neName">Event name</label>
    <input id="neName" class="input" maxlength="40" placeholder="Badminton Sunday" autocomplete="off" data-enter="#createEvent">
    <label class="lbl" for="neCoord">Coordinator (collects and pays out)</label>
    <input id="neCoord" class="input" maxlength="24" value="${esc(S.lastCoord)}" autocomplete="off">
    ${reuse}
    <label class="lbl" for="neOthers">Other people, separated by commas</label>
    <textarea id="neOthers" class="textarea" rows="3" placeholder="Anees, Riya, Sam"></textarea>
    <label class="lbl" for="neCur">Currency</label>
    <select id="neCur" class="select">${curOptions(S.lastCur)}</select>`;
  return shell('New event',body,`<button class="btn block" id="createEvent" data-act="createEvent">Create event</button>`);
}

function expenseDraft(ev,e){
  if(e){
    return {id:e.id,title:e.title,amountStr:String(e.amount/100),payer:e.payer,forIds:e.forIds.slice(),mode:isUneven(e)?e.mode:'equal',valsS:e.mode==='shares'?Object.assign({},e.vals):{},valsA:e.mode==='amount'?Object.assign({},e.vals):{}};
  }
  return {id:null,title:'',amountStr:'',payer:null,forIds:ev.members.map(m=>m.id),mode:'equal',valsS:{},valsA:{}};
}

const rangeLabel=(ev,vals)=>{const lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);return lo===hi?M(ev,lo):M(ev,lo)+' to '+M(ev,hi);};

function previewHtml(ev,d){
  const R=resolveDraft(ev,d),n=R.ids.length;
  if(R.idle)return '<span class="muted">Enter the amount and pick who it was for to see the split.</span>';
  let out='';
  if(R.mode==='shares'){
    if(!R.ok)return `<div class="pv-err">${esc(R.err)}</div>`;
    const tw=R.weights.reduce((a,b)=>a+b,0);
    out=`<div><b>${M(ev,R.amt)}</b> in ${+tw.toFixed(2)} share${tw===1?'':'s'}: about <b>${M(ev,Math.round(R.amt/tw))}</b> a share</div>`;
  }else if(R.mode==='amount'){
    if(R.err)return `<div class="pv-err">${esc(R.err)}</div>`;
    if(!R.ok)return R.over?`<div class="pv-err">The amounts add up to ${M(ev,R.over)} more than the total.</div>`:`<div class="pv-err">${M(ev,R.left)} of the total is still unassigned.</div>`;
    if(!R.nFixed){
      out=`<div><b>${M(ev,R.amt)}</b> split ${n} way${n===1?'':'s'}: <b>${rangeLabel(ev,Object.values(R.shares))}</b>${n>1?' each':''}</div>`;
    }else if(R.auto.length){
      const a=R.auto.length;
      out=`<div><b>${M(ev,R.amt-R.rest)}</b> is fixed. ${a===1?'The other person pays':'The other '+a+' share'} <b>${M(ev,R.rest)}</b>${a>1?': '+rangeLabel(ev,R.auto.map(id=>R.shares[id]))+' each':''}.</div>`;
    }else out=`<div>All <b>${M(ev,R.amt)}</b> is assigned.</div>`;
  }else{
    out=`<div><b>${M(ev,R.amt)}</b> split ${n} way${n===1?'':'s'}: <b>${rangeLabel(ev,Object.values(R.shares))}</b>${n>1?' each':''}</div>`;
  }
  if(d.payer){
    const p=esc(nm(ev,d.payer));
    if(R.ids.indexOf(d.payer)>=0){
      const own=R.shares[d.payer],back=R.amt-own;
      out+=back>0?`<div class="pv-sub">${p}'s own share (${M(ev,own)}) is not paid back, so ${p} gets back ${M(ev,back)}.</div>`:`<div class="pv-sub">Only for ${p}, so there is nothing to get back.</div>`;
    }else out+=`<div class="pv-sub">${p} is not in the split, so ${p} gets back the full ${M(ev,R.amt)}.</div>`;
  }else out+='<div class="pv-sub">Pick who paid.</div>';
  return out;
}

function splitRowsHtml(ev,d){
  if(d.mode==='equal')return '';
  const members=ev.members.filter(m=>d.forIds.indexOf(m.id)>=0);
  if(!members.length)return '<p class="hint">Tick at least one person above.</p>';
  const R=resolveDraft(ev,d),isS=d.mode==='shares',vals=(isS?d.valsS:d.valsA)||{};
  const rows=members.map(m=>{
    const ph=isS?'1':(R.shares&&R.shares[m.id]!=null?fmt(R.shares[m.id],''):'auto');
    const calc=isS?`<span class="calc">${R.ok&&R.shares?M(ev,R.shares[m.id]):'\u2013'}</span>`:'';
    return `<div class="srow ${isS?'s':''}" data-row="${m.id}">${avatar(m,'sm')}<label class="srow-name" for="sv_${m.id}">${esc(m.name)}</label><span class="srow-in">${isS?'':`<span class="pre">${esc(ev.currency)}</span>`}<input id="sv_${m.id}" data-field="sv" data-id="${m.id}" inputmode="decimal" autocomplete="off" placeholder="${esc(ph)}" value="${esc(vals[m.id]||'')}" aria-label="${isS?'Shares':'Amount'} for ${esc(m.name)}"></span>${calc}</div>`;
  }).join('');
  const hint=isS?'Give each person a share, such as 2 for a double portion. Leave it blank for 1.':'Type what a person owes. Anyone left blank shares whatever is left equally.';
  return `<div class="srows">${rows}</div><p class="hint">${hint}</p>`;
}

function updateSplitRows(){
  const ev=curEv(),d=ui.sheet&&ui.sheet.draft;
  if(!ev||!d||d.mode==='equal')return;
  const R=resolveDraft(ev,d);
  document.querySelectorAll('.srow').forEach(row=>{
    const id=row.dataset.row,inp=row.querySelector('input'),calc=row.querySelector('.calc');
    if(d.mode==='shares'){if(calc)calc.textContent=(R.ok&&R.shares&&R.shares[id]!=null)?M(ev,R.shares[id]):'\u2013';}
    else if(inp&&inp.value.trim()===''){inp.placeholder=(R.shares&&R.shares[id]!=null)?fmt(R.shares[id],''):'auto';}
  });
}

function renderSheet(){
  const root=$('#sheetRoot'),sh=ui.sheet;
  if(!sh){root.innerHTML='';return;}
  const ev=curEv();
  let html='';
  if(sh.type==='newEvent')html=newEventSheet();
  else if(sh.type==='expense'&&ev)html=expenseSheet(ev,sh.draft);
  else if(sh.type==='member'&&ev)html=memberSheet(ev,sh.id);
  else if(sh.type==='settings'&&ev)html=settingsSheet(ev);
  else if(sh.type==='confirm')html=confirmSheet(sh);
  else if(sh.type==='share'&&ev)html=shareSheet(ev);
  else if(sh.type==='backup')html=backupSheet();
  else if(sh.type==='restore')html=restoreSheet();
  else if(sh.type==='shareEvent'&&ev)html=shareEventSheet();
  else if(sh.type==='import')html=importSheet();
  else if(sh.type==='hub'&&ev)html=hubSheet();
  else if(sh.type==='image'&&ev)html=imageSheet();
  else if(sh.type==='reminders'&&ev)html=remindersSheet();
  else if(sh.type==='repeat'&&ev)html=repeatSheet();
  else if(sh.type==='privacy')html=privacySheet();
  root.innerHTML=html;
}

function syncExpense(rebuild){
  const ev=curEv(),d=ui.sheet&&ui.sheet.draft;
  if(!ev||!d)return;
  document.querySelectorAll('[data-act="pickPayer"]').forEach(b=>{const on=b.dataset.id===d.payer;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});
  document.querySelectorAll('[data-act="toggleFor"]').forEach(b=>{const on=d.forIds.indexOf(b.dataset.id)>=0;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});
  document.querySelectorAll('[data-act="splitMode"]').forEach(b=>{const on=b.dataset.mode===d.mode;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});
  const c=$('#forCount');if(c)c.textContent='('+d.forIds.length+' of '+ev.members.length+')';

function parseNames(raw){
  const out=[];
  String(raw||'').split(/[,\n;]+/).map(s=>s.trim().slice(0,24)).filter(Boolean).forEach(n=>{if(!out.some(x=>x.toLowerCase()===n.toLowerCase()))out.push(n);});
  return out;
}
function makeEvent(name,currency,names,extra){
  const members=names.map((n,i)=>({id:uid(),name:n,h:i%HUES}));
  const ev=Object.assign({id:uid(),name,currency,createdAt:Date.now(),coordId:members[0].id,members,expenses:[],mode:'hub',done:{}},extra||{});
  return ev;
}

let DL=null;
(function(){
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      window.claude.use('downloads').then(ns=>{DL=ns||null;if(DL&&ui.sheet&&(ui.sheet.type==='backup'||ui.sheet.type==='shareEvent'))renderSheet();}).catch(()=>{DL=null;});
    }
  }catch(e){DL=null;}
})();
const standalone=(()=>{try{return window.self===window.top;}catch(e){return false;}})();
const canSaveFile=()=>!!DL||standalone;
async function saveFile(name,data){
  if(DL){await DL.save({filename:name,data:data});return;}
  if(standalone){
    const blob=data instanceof Blob?data:new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=name;a.style.display='none';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    return;
  }
  const err=new Error('unavailable');err.code='unavailable';throw err;
}
const dateText=x=>{const d=new Date(x);return isNaN(d.getTime())?'':d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});};
function dateStamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}

function readBackupFile(f){

  const fr=new FileReader();
  fr.onload=()=>startRestore(String(fr.result||''));
  fr.onerror=()=>setErr('#rsErr','Could not read that file.');
  fr.readAsText(f);
}

function wrapText(ctx,text,maxW,maxLines){
  const words=String(text).split(/\s+/).filter(Boolean),lines=[];
  let cur='';
  for(const w of words){
    const t=cur?cur+' '+w:w;
    if(ctx.measureText(t).width<=maxW){cur=t;continue;}
    if(cur)lines.push(cur);
    cur=w;
    while(cur.length>1&&ctx.measureText(cur).width>maxW){
      let i=cur.length;
      while(i>1&&ctx.measureText(cur.slice(0,i)).width>maxW)i--;
      lines.push(cur.slice(0,i));cur=cur.slice(i);
    }
  }
  if(cur)lines.push(cur);
  if(lines.length>maxLines){
    lines.length=maxLines;
    let l=lines[maxLines-1];
    while(l.length>1&&ctx.measureText(l+'\u2026').width>maxW)l=l.slice(0,-1);
    lines[maxLines-1]=l+'\u2026';
  }
  return lines.length?lines:[''];
}
function fitText(ctx,text,maxW){
  if(ctx.measureText(text).width<=maxW)return text;
  let t=String(text);
  while(t.length>1&&ctx.measureText(t+'\u2026').width>maxW)t=t.slice(0,-1);
  return t+'\u2026';
}
function roundRect(g,x,y,w,h,r){
  g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.arcTo(x+w,y,x+w,y+r,r);g.lineTo(x+w,y+h-r);g.arcTo(x+w,y+h,x+w-r,y+h,r);
  g.lineTo(x+r,y+h);g.arcTo(x,y+h,x,y+h-r,r);g.lineTo(x,y+r);g.arcTo(x,y,x+r,y,r);g.closePath();
}
/* Draws the result card on a canvas: 1080 px wide, as tall as it needs to be. */
function drawResult(m){
  const W=1080,PAD=64,ROW=100,MAXROWS=40;
  const cs=getComputedStyle(document.documentElement);
  const FD=(cs.getPropertyValue('--f-display')||'').trim()||'sans-serif',FB=(cs.getPropertyValue('--f-body')||'').trim()||'sans-serif';
  const C={paper:'#EEF3EF',panel:'#FFFFFF',ink:'#0E241C',muted:'#4F6B5F',line:'#D5E0D9',ring:'#A9BBB1',court:'#0D6A54',cork:'#F2A93B',pos:'#0D6A54',neg:'#B3302A'};
  const probe=document.createElement('canvas').getContext('2d');
  probe.font='700 78px '+FD;
  const titleLines=wrapText(probe,m.title,W-2*PAD,2);
  const headH=PAD+titleLines.length*86+150;
  let used=0;
  const secs=m.sections.map(s=>{const rows=s.rows.slice(0,Math.max(1,MAXROWS-used));used+=rows.length;return {title:s.title,rows,cut:s.rows.length-rows.length};});
  const blockH=(n,cut)=>96+n*ROW+(cut?64:0)+36;
  let bodyH=24;
  secs.forEach(s=>{bodyH+=blockH(s.rows.length,s.cut);});
  const bal=m.balances?m.balances.slice(0,60):null;
  if(bal)bodyH+=blockH(bal.length,m.balances.length-bal.length);
  const H=headH+bodyH+120;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const g=cv.getContext('2d');
  g.fillStyle=C.paper;g.fillRect(0,0,W,H);
  g.fillStyle=C.court;g.fillRect(0,0,W,headH);
  g.textBaseline='alphabetic';g.textAlign='left';
  g.fillStyle='#FFFFFF';g.font='700 78px '+FD;
  titleLines.forEach((l,i)=>g.fillText(l,PAD,PAD+70+i*86));
  const infoY=PAD+titleLines.length*86+96;
  g.fillStyle='rgba(255,255,255,.85)';g.font='500 32px '+FB;g.fillText('Total spent',PAD,infoY-40);
  g.fillStyle=C.cork;g.font='700 64px '+FD;g.fillText(m.total,PAD,infoY+22);
  g.fillStyle='rgba(255,255,255,.85)';g.font='500 32px '+FB;g.textAlign='right';g.fillText(m.date,W-PAD,infoY+18);g.textAlign='left';
  let y=headH+24;
  const panel=(top,n)=>{roundRect(g,PAD,top,W-2*PAD,n*ROW,28);g.fillStyle=C.panel;g.fill();g.lineWidth=3;g.strokeStyle=C.line;g.stroke();};
  const sep=(yy)=>{g.beginPath();g.moveTo(PAD+28,yy);g.lineTo(W-PAD-28,yy);g.lineWidth=2;g.strokeStyle=C.line;g.stroke();};
  const heading=(t)=>{g.fillStyle=C.ink;g.font='700 54px '+FD;g.fillText(t,PAD,y+64);};
  secs.forEach(s=>{
    heading(s.title);
    const top=y+96;
    panel(top,s.rows.length);
    s.rows.forEach((r,i)=>{
      const yc=top+i*ROW+ROW/2,x0=PAD+(r.plain?36:104);
      if(i)sep(top+i*ROW);
      if(!r.plain){
        g.beginPath();g.arc(PAD+58,yc,24,0,Math.PI*2);
        if(r.done){g.fillStyle=C.pos;g.fill();g.strokeStyle='#FFFFFF';g.lineWidth=6;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(PAD+46,yc+1);g.lineTo(PAD+55,yc+10);g.lineTo(PAD+72,yc-9);g.stroke();}
        else{g.lineWidth=5;g.strokeStyle=C.ring;g.stroke();}
      }
      const amtW=(()=>{g.font='700 56px '+FD;return r.amount?g.measureText(r.amount).width:0;})();
      g.font='600 42px '+FB;
      const name=fitText(g,r.name,W-2*PAD-(r.plain?36:104)-amtW-70);
      g.fillStyle=r.done?C.muted:C.ink;g.fillText(name,x0,yc+15);
      if(r.done){const w=g.measureText(name).width;g.beginPath();g.moveTo(x0,yc+2);g.lineTo(x0+w,yc+2);g.lineWidth=3;g.strokeStyle=C.muted;g.stroke();}
      if(r.amount){g.font='700 56px '+FD;g.textAlign='right';g.fillStyle=r.done?C.muted:C.ink;g.fillText(r.amount,W-PAD-34,yc+20);g.textAlign='left';}
    });
    if(s.cut){g.fillStyle=C.muted;g.font='500 34px '+FB;g.fillText('+ '+s.cut+' more',PAD+8,top+s.rows.length*ROW+46);}
    y+=blockH(s.rows.length,s.cut);
  });
  if(bal){
    heading('Balances');
    const top=y+96;
    panel(top,bal.length);
    bal.forEach((r,i)=>{
      const yc=top+i*ROW+ROW/2;
      if(i)sep(top+i*ROW);
      g.font='600 42px '+FB;g.fillStyle=C.ink;g.fillText(fitText(g,r.name,W-2*PAD-420),PAD+36,yc+15);
      g.font='700 52px '+FD;g.textAlign='right';g.fillStyle=r.sign>0?C.pos:r.sign<0?C.neg:C.muted;g.fillText(r.text,W-PAD-34,yc+19);g.textAlign='left';
    });
    if(m.balances.length>bal.length){g.fillStyle=C.muted;g.font='500 34px '+FB;g.fillText('+ '+(m.balances.length-bal.length)+' more',PAD+8,top+bal.length*ROW+46);}
    y+=blockH(bal.length,m.balances.length-bal.length);
  }
  g.fillStyle=C.muted;g.font='500 30px '+FB;g.textAlign='center';g.fillText('Made with Evenly',W/2,H-52);g.textAlign='left';
  return cv;
}

async function copyPlain(text,ta){
  let ok=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);ok=true;}}catch(e){}
  if(!ok&&ta){try{ta.focus();ta.select();ta.setSelectionRange(0,text.length);ok=document.execCommand('copy');}catch(e){}}
  return ok;
}
function remindersSheet(){
  const ev=curEv();if(!ev)return '';
  const P=getPlan(ev,compute(ev)),items=remindItems(ev,unpaidList(ev,P));
  if(!items.length)return shell('Send reminders',`<div class="note">${icon('check',18)}<span>Everyone has paid. There is nothing to remind.</span></div>`,'');
  const mode=ui.remMode==='each'?'each':'group',money=v=>M(ev,v);
  const seg=`<div class="seg" role="group" aria-label="Who to message"><button type="button" class="${mode==='group'?'on':''}" data-act="remindMode" data-mode="group" aria-pressed="${mode==='group'}">Group message</button><button type="button" class="${mode==='each'?'on':''}" data-act="remindMode" data-mode="each" aria-pressed="${mode==='each'}">Each person</button></div>`;
  let body,foot='';
  if(mode==='group'){
    const text=reminderGroup(ev.name,nm(ev,ev.coordId),P.hubOn,items,money);
    body=`${seg}<label class="lbl" for="remText">Message</label><textarea id="remText" class="textarea" rows="8">${esc(text)}</textarea><p class="hint">You can edit it first. WhatsApp opens with the message ready, and you choose the chat.</p>`;
    foot=`<div class="foot-row"><button class="btn outline" data-act="remindCopy">${icon('copy',18)}Copy</button><button class="btn" data-act="remindGroup">${icon('share',18)}Open WhatsApp</button></div>`;
  }else{
    const rows=payersOf(ev,items).map(p=>`<li><div class="rem-row">${avatar(mem(ev,p.id),'sm')}<span class="led-main"><span class="led-title">${esc(p.name)}</span><span class="led-sub">owes ${money(p.total)}</span></span><button class="btn sm" data-act="remindOne" data-id="${p.id}">WhatsApp</button></div></li>`);
    body=`${seg}<ul class="ledger">${rows.join('')}</ul><p class="hint">Each button opens WhatsApp with that person's message ready. You choose the chat. No phone numbers are stored.</p>`;
  }
  return shell('Send reminders',body,foot);
}

const shortDate=()=>new Date().toLocaleDateString(undefined,{day:'numeric',month:'short'});
function repeatSheet(){
  const ev=curEv();if(!ev)return '';
  const sh=ui.sheet,copy=!!sh.copyExp;
  const hint=copy
    ?`Also copies the ${plural(ev.expenses.length,'expense')}, so you only change what is different this time.`
    :'A clean event with the same people and the same coordinator.';
  const body=`<label class="lbl" for="rpName">Name for the new event</label>
    <input id="rpName" class="input" maxlength="40" autocomplete="off" value="${esc(sh.name)}" data-enter="#createRepeat">
    <div class="lbl">What to copy</div>
    <div class="seg" role="group" aria-label="What to copy"><button type="button" class="${copy?'':'on'}" data-act="repeatCopy" data-copy="0" aria-pressed="${!copy}">People only</button><button type="button" class="${copy?'on':''}" data-act="repeatCopy" data-copy="1" aria-pressed="${copy}">With expenses</button></div>
    <p class="hint">${hint} Ticked payments are never copied.</p>`;
  return shell('Repeat this event',body,`<button class="btn block" id="createRepeat" data-act="createRepeat">Create event</button>`);
}
function privacySheet(){
  const body=`<p class="bk-p">Evenly keeps your events only in this browser. Nothing is sent to a server, and there are no accounts, cookies or trackers.</p>
    <p class="bk-p">Backup files and shared events contain names and amounts, so share them only with people you trust.</p>
    <p class="bk-p">On a shared phone or browser, delete your data when you are done.</p>
    <button class="btn danger block gap mt12" data-act="askWipe">${icon('trash',18)}Delete all my data</button>`;
  return shell('Privacy',body,'');
}
function wipeAll(){
  try{localStorage.removeItem(KEY);}catch(e){}
  S={v:1,events:[],currentId:null,tab:'expenses',lastCoord:'Jinan',lastCur:'\u20B9',lastBackup:0};
  closeSheet();render();window.scrollTo(0,0);
  toast('Everything on this device was deleted');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='backdrop'){if(e.target===t)closeSheet();return;}
  const fn=ACT[a];if(fn)fn(t,e);
});
document.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.field;if(!f)return;
  const d=ui.sheet&&ui.sheet.draft,ev=curEv();
  if(!d||!ev)return;
  if(f==='amount'){
    const v=e.target.value.replace(/[^\d.,\s]/g,'');
    if(v!==e.target.value)e.target.value=v;
    d.amountStr=v;
  }else if(f==='title'){d.title=e.target.value;}
  else if(f==='sv'){
    const v=e.target.value.replace(/[^\d.,\s]/g,'');
    if(v!==e.target.value)e.target.value=v;
    (d.mode==='shares'?d.valsS:d.valsA)[e.target.dataset.id]=v;
  }
  updateSplitRows();
  const p=$('#expPreview');if(p)p.innerHTML=previewHtml(ev,d);
  setErr('#expErr','');
});
document.addEventListener('change',e=>{
  if(e.target.id==='rsFile'){
    const f=e.target.files&&e.target.files[0];
    if(f)readBackupFile(f);
    return;
  }
  if(e.target.dataset&&e.target.dataset.field==='reuse'){
    const src=S.events.find(x=>x.id===e.target.value),ta=$('#neOthers'),co=($('#neCoord').value||'').trim().toLowerCase();
    if(src&&ta)ta.value=src.members.map(m=>m.name).filter(n=>n.toLowerCase()!==co).join(', ');
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.sheet){closeSheet();return;}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){
    e.preventDefault();
    const b=$(e.target.dataset.enter);if(b)b.click();
  }
});

load();
render();
})();
</script>
